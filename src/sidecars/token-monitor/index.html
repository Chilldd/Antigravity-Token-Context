  * { box-sizing: border-box; }
  ::selection {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--fg);
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sub-row:focus-visible,
  .turn-row:focus-visible {
    outline-offset: -2px;
  }
  html {
    overflow-y: scroll;
  }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--bg-canvas);
    caret-color: var(--accent);
    font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--fg) 15%, transparent);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--fg) 26%, transparent); }

  main { padding: 10px 12px 18px; overflow-x: clip; }
  .num {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .dim { color: var(--dim); }
  .val-unit {
    font-size: 0.64em;
    font-weight: 500;
    color: var(--dim);
    margin-left: 1px;
    letter-spacing: 0;
  }
  .val-unit-sp { font-size: 0.56em; }
  .val-prefix {
    font-size: 0.74em;
    font-weight: 500;
    opacity: 0.72;
    margin-right: 1px;
  }
  .sub-ctx .val-unit,
  .turn-spd .val-unit,
  .model-bar-top .val-unit { font-size: 0.78em; }
  .sub-ctx .val-prefix,
  .model-bar-top .val-prefix { font-size: 0.82em; }

  /* Segmented Control (Primary Tabs & Time Range) */
  .seg-bar {
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: 2px;
    border-radius: 8px;
    background: var(--seg-bg);
    border: 1px solid var(--line-subtle);
    gap: 2px;
  }
  .seg-btn {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.14s ease, background-color 0.14s ease, box-shadow 0.14s ease, transform 0.1s ease;
  }
  .seg-btn:hover { color: var(--fg); }
  .seg-btn:active { transform: scale(0.97); }
  .seg-btn.active {
    background: var(--seg-active-bg);
    color: var(--fg);
    font-weight: 600;
    box-shadow: var(--seg-active-shadow);
  }
  .seg-bar.has-thumb .seg-btn.active {
    background: transparent;
    box-shadow: none;
  }
  .seg-thumb {
    position: absolute;
    top: 2px;
    bottom: 2px;
    left: 0;
    border-radius: 6px;
    background: var(--seg-active-bg);
    box-shadow: var(--seg-active-shadow);
    pointer-events: none;
    z-index: 0;
    will-change: transform, width;
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), width 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .seg-bar.seg-sm {
    border-radius: 7px;
  }
  .seg-bar.seg-sm .seg-thumb {
    border-radius: 5px;
  }
  .seg-bar.seg-sm .seg-btn {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 5px;
  }

  /* Lightweight Borderless Toggle (Secondary Filters) */
  .ghost-seg {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .ghost-btn {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    font-weight: 450;
    padding: 3px 6px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.14s ease, background-color 0.14s ease, transform 0.1s ease;
  }
  .ghost-btn:hover {
    color: var(--fg);
    background: var(--surface-subtle);
  }
  .ghost-btn:active { transform: scale(0.97); }
  .ghost-btn.active {
    color: var(--fg);
    font-weight: 600;
    background: var(--surface-hover);
  }
  .ghost-seg.has-thumb .ghost-btn.active {
    background: transparent;
  }
  .ghost-thumb {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    border-radius: 5px;
    background: var(--surface-hover);
    pointer-events: none;
    z-index: 0;
    will-change: transform, width;
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), width 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .ghost-currency { transition: opacity 0.15s ease; }
  .ghost-currency.is-muted { opacity: 0.68; }
  .ghost-currency.is-muted:hover,
  .ghost-currency.is-muted:focus-within { opacity: 1; }
  .ghost-currency .ghost-btn { padding: 3px 5px; font-weight: 500; }

  .tool-div {
    width: 1px;
    height: 12px;
    background: var(--line);
    flex: none;
  }

  /* Compact 2-Row Top Control */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    min-height: 28px;
    margin-bottom: 8px;
  }
  .header-actions {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex: none;
  }
  .filter-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 26px;
    margin-bottom: 10px;
  }
  .filter-secondary {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-subtle);
    font-size: 11.5px;
  }
  .model-row:last-child { border-bottom: none; }
  .model-bar-wrap { flex: 1; min-width: 0; }
  .model-bar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 17px;
    margin-bottom: 5px;
  }
  .model-bar-name {
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .model-bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.55s cubic-bezier(0.25, 1, 0.5, 1); }
  .model-bar > div.skel { background: var(--track); }
  .model-bar.cost-bar > div { background: var(--warn); }
  .model-bar-sub {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--dim);
  }
  .sub-ctx-sub { font-size: 10.5px; color: var(--dim); margin-top: 1px; }

  /* Charts */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 10px;
  }
  .chart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 18px;
    margin-bottom: 8px;
  }
  .chart-title { font-size: 11.5px; font-weight: 600; color: var(--fg); letter-spacing: -0.005em; }
  .chart-svg { width: 100%; display: block; overflow: visible; }
  .tm-pill-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .tm-list { margin: 2px -12px -11px; border-top: 1px solid var(--line-subtle); }

  /* Session Sub-header */
  .session-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 26px;
    margin-bottom: 10px;
  }
  .session-title {
    min-width: 0;
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
  }
  .model-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    max-width: 58%;
    flex: 0 1 auto;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.running { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.38; } }
  .model-name {
    font-weight: 600;
    font-size: 11.5px;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 26px;
    padding: 0 8px;
    border-radius: 7px;
    font: inherit;
    font-size: 11.5px;
    color: var(--dim);
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: color 0.14s ease, background-color 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
  }
  .icon-btn.icon-only {
    width: 26px;
    padding: 0;
  }
  .icon-btn:hover:not(:disabled) {
    color: var(--fg);
    background: var(--surface-subtle);
    border-color: var(--line-strong);
  }
  .icon-btn:active:not(:disabled),
  .back-btn:active,
  .hero-alert-btn:active { transform: scale(0.97); }
  .icon-btn:disabled { opacity: 0.42; cursor: default; }
  .icon-btn svg { width: 13px; height: 13px; }
  .icon-btn.active {
    color: var(--accent-fg);
    background: var(--accent-bg);
    border-color: var(--accent-border);
  }
  .icon-btn.primary {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .icon-btn.primary:hover:not(:disabled) {
    color: #fff;
    background: color-mix(in srgb, var(--accent) 88%, #000);
    border-color: var(--accent);
  }

  /* Settings View */
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 10px;
  }
  .settings-note {
    font-size: 11px;
    color: var(--dim);
    margin: 0 0 8px;
    line-height: 1.45;
  }
  .rate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .rate-input-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .field-input {
    width: 100%;
    height: 26px;
    padding: 0 7px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-canvas);
    color: var(--fg);
    font: inherit;
    font-size: 11.5px;
    transition: border-color 0.14s ease;
  }
  .field-input:focus {
    outline: 1.5px solid var(--accent);
    border-color: var(--accent);
  }
  .price-rule-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .price-rule {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 9px;
    background: var(--surface-subtle);
  }
  .price-rule-head {
    display: grid;
    grid-template-columns: 1fr 1fr 24px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .price-rule-del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color 0.14s ease, background-color 0.14s ease;
  }
  .price-rule-del svg { width: 12px; height: 12px; }
  .price-rule-del:hover {
    color: var(--danger-fg);
    background: var(--danger-bg);
  }
  .price-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }
  .price-field label {
    display: block;
    font-size: 10px;
    color: var(--dim);
    margin-bottom: 2px;
  }
  .price-field .field-input {
    height: 24px;
    padding: 0 5px;
    font-size: 11px;
  }
  .settings-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .settings-status {
    font-size: 11px;
    color: var(--ok-fg);
  }
  .settings-status.err {
    color: var(--danger-fg);
  }
  .icon-btn.loading svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .back-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    font-size: 11.5px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--accent-border);
    background: var(--surface);
    color: var(--accent-fg);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.14s ease, transform 0.1s ease;
  }
  .back-btn svg { width: 11px; height: 11px; }
  .back-btn:hover { background: var(--surface-subtle); }

  /* Hero Context Card with 100-dot grid */
  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    padding: 12px 12px 10px;
    margin-bottom: 10px;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; }
  .hero-label { font-size: 11.5px; font-weight: 500; color: var(--dim); }
  .pct-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .pct-pill.tone-accent { color: var(--accent-fg); background: var(--accent-bg); border-color: var(--accent-border); }
  .pct-pill.tone-warn { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-border); }
  .pct-pill.tone-crit { color: var(--danger-fg); background: var(--danger-bg); border-color: var(--danger-border); }
  .hero-nums { display: flex; align-items: baseline; gap: 5px; margin: 4px 0 11px; }
  .hero-used { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; color: var(--fg); }
  .hero-max { font-size: 12px; color: var(--dim); }

  .dot-grid {
    display: grid;
    grid-template-columns: repeat(20, minmax(0, 1fr));
    gap: 4px;
    max-width: 320px;
    margin-bottom: 11px;
  }
  .ctx-dot {
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--empty-dot);
    transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.22s ease;
  }
  .dot-grid.animate-in .ctx-dot {
    animation: dotIn 0.48s cubic-bezier(0.25, 1, 0.5, 1) both;
    animation-delay: var(--dot-delay, 0ms);
  }
  @keyframes dotIn {
    from { opacity: 0; transform: scale(0.45); }
    to { opacity: 1; transform: scale(1); }
  }
  .hero.has-hover .ctx-dot { opacity: 0.22; }
  .hero.has-hover .ctx-dot.is-match { opacity: 1; transform: scale(1.22); }

  .cat-list {
    border-top: 1px solid var(--line-subtle);
    padding-top: 7px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cat-row {
    display: grid;
    grid-template-columns: 10px 1fr auto 44px;
    align-items: center;
    gap: 7px;
    min-height: 23px;
    font-size: 11.5px;
    padding: 3px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    cursor: default;
    transition: background-color 0.14s ease;
  }
  .cat-row.is-match { background: var(--surface-subtle); }
  .cat-more-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    margin-top: 2px;
    padding: 2px 6px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.14s ease, background-color 0.14s ease;
  }
  .cat-more-btn:hover { color: var(--fg); background: var(--surface-subtle); }
  .cat-more-btn svg { width: 11px; height: 11px; transition: transform 0.2s ease; }
  .cat-more-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .cat-mark { width: 7px; height: 7px; border-radius: 50%; justify-self: center; }
  .cat-mark.free { background: transparent; border: 1.5px solid var(--empty-dot); }
  .cat-tok { text-align: right; font-weight: 500; color: var(--fg); }
  .cat-pct { text-align: right; color: var(--dim); font-size: 11px; }

  .hero-alert {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 10px;
    padding: 7px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.4;
  }
  .hero-alert.warn {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-fg);
  }
  .hero-alert.crit {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger-fg);
  }
  .hero-alert-btn {
    flex: none;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.14s ease, transform 0.1s ease;
  }
  .hero-alert-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }

  .err-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger-fg);
    font-size: 11.5px;
  }
  .empty-card {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    color: var(--dim);
  }
  .empty-card-title { font-size: 12.5px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .empty-card-desc { font-size: 11.5px; margin-bottom: 12px; }
  .empty-card-actions { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .mock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    padding: 6px 9px;
    border-radius: 8px;
    background: var(--accent-bg);
    border: 1px dashed var(--accent-border);
    font-size: 11px;
  }
  .mock-tag { font-weight: 600; color: var(--accent-fg); }

  /* Unified 2x2 Bento KPI Card (Hairline Inner Dividers) */
  .bento {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--line-subtle);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .kpi {
    background: var(--surface);
    padding: 11px 12px;
    transition: background-color 0.14s ease;
  }
  .kpi.kpi-wide { grid-column: 1 / -1; }
  .kpi:hover { background: var(--surface-subtle); }
  .kpi-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    min-height: 16px;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 5px;
  }
  .kpi-tag {
    font-size: 10.5px;
    font-weight: 450;
    color: var(--dim);
    opacity: 0.85;
    white-space: nowrap;
  }
  .kpi-val {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--fg);
    min-height: 26px;
    line-height: 1.25;
  }
  .kpi-sub {
    font-size: 10.5px;
    color: var(--dim);
    margin-top: 4px;
    line-height: 1.4;
    min-height: 15px;
  }
  .stage-skeleton .kpi-val,
  .stage-skeleton .kpi-sub,
  .skel-crossfade-out .kpi-val,
  .skel-crossfade-out .kpi-sub { display: flex; align-items: center; }

  /* Subagents & Lists Section */
  .sub-card {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .sub-list { border-top: 1px solid var(--line-subtle); }
  .sub-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-subtle);
    cursor: pointer;
    transition: background-color 0.14s ease;
  }
  .sub-row:last-child { border-bottom: none; }
  .sub-row:hover { background: var(--surface-subtle); }
  .rank-idx {
    flex: none;
    width: 16px;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    text-align: right;
  }
  .sub-left { min-width: 0; flex: 1; }
  .sub-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg); }
  .sub-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .sub-dot.running { animation: pulse 1.5s ease-in-out infinite; }
  .sub-dot.killed { background: var(--dim); }
  .sub-role { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-meta { font-size: 10.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-right { text-align: right; flex: none; min-width: 72px; }
  .sub-ctx { font-size: 11.5px; font-weight: 600; color: var(--fg); }
  .sub-ctx.tone-accent { color: var(--accent-fg); }
  .sub-ctx.tone-warn { color: var(--warn-fg); }
  .sub-ctx.tone-crit { color: var(--danger-fg); }
  .sub-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 4px; }
  .sub-bar > div { height: 100%; border-radius: 999px; transition: width 0.55s cubic-bezier(0.25, 1, 0.5, 1); }
  .row-chevron {
    width: 12px;
    height: 12px;
    flex: none;
    color: var(--dim);
    opacity: 0.28;
    transition: opacity 0.14s ease, transform 0.14s ease;
  }
  .sub-row:hover .row-chevron,
  .sub-row:focus-visible .row-chevron {
    opacity: 0.85;
    transform: translateX(2px);
  }

  .swarm-dist {
    padding: 9px 12px;
    border-top: 1px solid var(--line-subtle);
    border-bottom: 1px solid var(--line-subtle);
    background: var(--surface-subtle);
  }
  .swarm-dist-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .swarm-stack {
    display: flex;
    height: 6px;
    border-radius: 999px;
    overflow: hidden;
    gap: 1.5px;
    background: var(--track);
    margin-bottom: 7px;
  }
  .swarm-seg { height: 100%; min-width: 3px; }
  .swarm-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-size: 10.5px;
    color: var(--dim);
  }
  .swarm-leg-item { display: inline-flex; align-items: center; gap: 4px; }
  .swarm-leg-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .state-pill {
    font-size: 10px;
    font-weight: 500;
    padding: 0 5px;
    border-radius: 4px;
    flex: none;
  }
  .state-pill.running { color: var(--ok-fg); background: var(--ok-bg); }
  .state-pill.idle { color: var(--dim); background: var(--surface-subtle); border: 1px solid var(--line-subtle); }
  .state-pill.killed { color: var(--dim); opacity: 0.7; background: var(--surface-subtle); }

  /* Collapsible & Paginated Turns */
  .turns-card {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 10px;
    overflow: hidden;
  }
  .turns-toggle,
  .card-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    padding: 9px 12px;
    border: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
  }
  .turns-toggle {
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  .turns-toggle:hover { background: var(--surface-subtle); }
  .turns-toggle-left { display: inline-flex; align-items: center; gap: 6px; }
  .chevron { width: 13px; height: 13px; color: var(--dim); transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1); }
  .chevron.open { transform: rotate(90deg); }

  .turn-list { border-top: 1px solid var(--line-subtle); }
  .turn-item { border-bottom: 1px solid var(--line-subtle); }
  .turn-item:last-child { border-bottom: none; }
  .turn-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  .turn-row:hover { background: var(--surface-subtle); }
  .turn-row[aria-expanded="true"] { background: var(--surface-subtle); }
  .turn-detail {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 6px 12px 8px 52px;
    border-top: 1px solid var(--line-subtle);
    background: var(--surface-subtle);
    font-size: 10.5px;
    color: var(--dim);

  function fmtCost(usd, { compact = false } = {}) {
    const raw = Number(usd);

    const v = currency === 'CNY' ? raw * usdToCny : raw;
    if (v === 0) return `${sym}0`;
    if (v < 0.001) return `<${sym}0.001`;
    if (v < 0.01) return `${sym}${v.toFixed(4)}`;
    if (v < 1) return `${sym}${v.toFixed(3)}`;
    if (compact && v >= 1000) return `${sym}${(v / 1000).toFixed(2)}k`;
    return `${sym}${v.toFixed(2)}`;
  }

  function fmtCostHtml(usd, { compact = false } = {}) {
    const raw = Number(usd);

    const v = currency === 'CNY' ? raw * usdToCny : raw;
    const pfx = `<span class="val-prefix">${sym}</span>`;
    if (v === 0) return `${pfx}0`;
    if (v < 0.001) return `<span class="val-prefix">&lt;${sym}</span>0.001`;
    if (v < 0.01) return `${pfx}${v.toFixed(4)}`;
    if (v < 1) return `${pfx}${v.toFixed(3)}`;
    if (compact && v >= 1000) return `${pfx}${(v / 1000).toFixed(2)}<span class="val-unit">k</span>`;
    return `${pfx}${v.toFixed(2)}`;
  }

  let colorProbeEl = null;
  function parseCssColorLum(val) {
    if (!val || val === 'transparent' || val === 'none') return null;
    if (!colorProbeEl) {
      colorProbeEl = document.createElement('span');
      colorProbeEl.style.cssText = 'position:fixed;left:-9999px;visibility:hidden;pointer-events:none;';
      document.body.appendChild(colorProbeEl);
    }
    colorProbeEl.style.color = '';
    colorProbeEl.style.color = val;
    if (!colorProbeEl.style.color) return null;
    const rgb = getComputedStyle(colorProbeEl).color;
    const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
    if (!m) return null;
    const alpha = m[4] === undefined ? 1 : Number(m[4]);
    if (alpha <= 0.1) return null;
    return (0.299 * Number(m[1]) + 0.587 * Number(m[2]) + 0.114 * Number(m[3])) / 255;
  }

  function syncSurfaceTheme() {
    const themeParam = params.get('theme');
    let dark = null;
    if (themeParam === 'dark') dark = true;
    else if (themeParam === 'light') dark = false;

    if (dark === null) {
      const rootCs = getComputedStyle(document.documentElement);
      const hostBgLum = parseCssColorLum(rootCs.getPropertyValue('--background').trim());
      if (hostBgLum !== null) {
        dark = hostBgLum <= 0.5;
      } else {
        const hostFgLum = parseCssColorLum(rootCs.getPropertyValue('--foreground').trim());
        if (hostFgLum !== null) dark = hostFgLum > 0.55;
      }
    }

    if (dark === null) {
      dark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark-surface', dark);
    document.documentElement.classList.toggle('light-surface', !dark);
    return dark;
  }

  function getThemeColors() {
    const isDark = syncSurfaceTheme();
    const cs = getComputedStyle(document.documentElement);
    const v = (name) => cs.getPropertyValue(name).trim();
    const treemap = {};
    for (const k of TREEMAP_KEYS) {
      treemap[k] = {
        bg: v(`--tm-${k}-bg`),
        border: v(`--tm-${k}-border`),
        fg: v(`--tm-${k}-fg`),
        accent: v(`--tm-${k}-accent`),
      };
    }
    return {
      isDark,
      fg: v('--fg'),
      fgSecondary: v('--fg-secondary'),
      dim: v('--dim'),
      line: v('--line'),
      surface: v('--surface'),
      tooltipBg: v('--tooltip-bg'),
      tooltipBorder: v('--tooltip-border'),
      tooltipShadow: v('--tooltip-shadow'),
      vizCache: v('--viz-cache'),
      vizInput: v('--viz-input'),
      vizOutput: v('--viz-output'),
      vizGrid: v('--viz-grid'),
      treemap,
    };
  }

  syncSurfaceTheme();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {

  }

  function pruneSmallTreemapLabels(chart) {
    if (!chart || chart.isDisposed?.()) return;
    try {
      const displayList = chart.getZr()?.storage?.getDisplayList() || [];
      for (const el of displayList) {
        if (el?.type !== 'rect' || !el.shape || typeof el.getTextContent !== 'function') continue;
        const tc = el.getTextContent();
        if (!tc) continue;
        const w = Number(el.shape.width) || 0;
        const h = Number(el.shape.height) || 0;
        if (tc.__agyFullText === undefined) {
          tc.__agyFullText = tc.style?.text || '';
        }
        const fullText = tc.__agyFullText;
        if (tc.disableLabelLayout) {
          if (w < 54 || h < 24) {
            tc.attr('ignore', true);
          } else if (w < 88) {
            tc.attr('ignore', false);
            const shortTitle = String(fullText).replace(/\s+\d+%$/, '');
            if (tc.style?.text !== shortTitle) tc.setStyle('text', shortTitle);
          } else {
            tc.attr('ignore', false);
            if (tc.style?.text !== fullText) tc.setStyle('text', fullText);
          }
          continue;
        }
        if (w < 52 || h < 24) {
          tc.attr('ignore', true);
        } else if (h < 38) {
          tc.attr('ignore', false);
          const firstLine = String(fullText).split('\n')[0];
          if (tc.style?.text !== firstLine) tc.setStyle('text', firstLine);
        } else {
          tc.attr('ignore', false);
          if (tc.style?.text !== fullText) tc.setStyle('text', fullText);
        }
      }
    } catch {}
  }

        const direction = (prevIdx >= 0 && nextIdx >= 0) ? (nextIdx > prevIdx ? 'forward' : 'backward') : 'fade';

        lastSummary = null;
        lastSummaryPayload = '';

  const STAGE_EXIT_MS = 150;
  const STAGE_FADE_EXIT_MS = 120;
  const MIN_SKEL_MS = 360;
  const CROSSFADE_OUT_MS = 220;

  let transitionToken = 0;
  let activeTransition = null;
  let pendingTabFocus = false;

  function sleep(ms) {
    return ms > 0 ? new Promise((r) => setTimeout(r, ms)) : Promise.resolve();
  }

  function ensureShell() {
    let topBar = document.getElementById('top-bar');
    let stage = document.getElementById('view-stage');
    if (!topBar || !stage) {
      appEl.innerHTML = '<div id="top-bar"></div><div id="view-stage" class="view-stage"></div>';
      topBar = document.getElementById('top-bar');
      stage = document.getElementById('view-stage');
    }
    return { topBar, stage };
  }

  function captureSegRects(root) {
    const rects = new Map();
    if (!root) return rects;
    root.querySelectorAll('.seg-bar[aria-label], .ghost-seg[aria-label]').forEach((group) => {
      const key = group.getAttribute('aria-label');
      const isGhost = group.classList.contains('ghost-seg');
      const activeBtn = group.querySelector(isGhost ? '.ghost-btn.active' : '.seg-btn.active');
      if (key && activeBtn && activeBtn.offsetWidth > 0) {
        rects.set(key, { x: activeBtn.offsetLeft, w: activeBtn.offsetWidth });
      }
    });
    return rects;
  }

  function syncSegThumbs(root, prevRects = null) {
    if (!root) return;
    const noMotion = reduceMotion();
    root.querySelectorAll('.seg-bar, .ghost-seg').forEach((group) => {
      const isGhost = group.classList.contains('ghost-seg');
      const thumbCls = isGhost ? 'ghost-thumb' : 'seg-thumb';
      const activeBtn = group.querySelector(isGhost ? '.ghost-btn.active' : '.seg-btn.active');
      let thumb = group.querySelector(`:scope > .${thumbCls}`);
      if (!activeBtn || activeBtn.offsetWidth <= 0) {
        thumb?.remove();
        group.classList.remove('has-thumb');
        return;
      }
      group.classList.add('has-thumb');
      const isNew = !thumb;
      if (isNew) {
        thumb = document.createElement('span');
        thumb.className = thumbCls;
        thumb.setAttribute('aria-hidden', 'true');
        group.prepend(thumb);
      }
      const nextX = activeBtn.offsetLeft;
      const nextW = activeBtn.offsetWidth;
      const key = group.getAttribute('aria-label');
      const prev = key && prevRects ? prevRects.get(key) : null;

      if (!noMotion && prev && (prev.x !== nextX || prev.w !== nextW)) {
        thumb.style.transition = 'none';
        thumb.style.width = `${prev.w}px`;
        thumb.style.transform = `translateX(${prev.x}px)`;
        void thumb.offsetWidth;
        thumb.style.transition = '';
        thumb.style.width = `${nextW}px`;
        thumb.style.transform = `translateX(${nextX}px)`;
      } else if (isNew || noMotion) {
        thumb.style.transition = 'none';
        thumb.style.width = `${nextW}px`;
        thumb.style.transform = `translateX(${nextX}px)`;
        void thumb.offsetWidth;
        thumb.style.transition = '';
      } else {
        thumb.style.width = `${nextW}px`;
        thumb.style.transform = `translateX(${nextX}px)`;
      }
    });
  }

  function syncTopBar() {
    const { topBar } = ensureShell();
    const prevRects = captureSegRects(topBar);
    topBar.innerHTML = renderTopBar();
    bindTopBarEvents(topBar);
    syncSegThumbs(topBar, prevRects);
    restoreTabFocus();
  }

  function mountSkeletonLayer(mode, enterClass) {
    const { stage } = ensureShell();
    stage.setAttribute('aria-busy', 'true');
    stage.setAttribute('aria-label', mode === 'summary' ? '正在加载全局统计' : '正在加载会话数据');

    const layer = document.createElement('div');
    layer.className = `stage-layer stage-skeleton${enterClass ? ' ' + enterClass : ''}`;
    layer.innerHTML = renderSkeletonInnerHtml(mode);
    stage.replaceChildren(layer);
  }

  function beginViewTransition({ mode = viewMode, direction = 'forward', skipExit = false } = {}) {
    disposeCharts();
    syncTopBar();
    setRefreshBtnLoading(true);
    pendingChartAnim = true;

    const token = ++transitionToken;
    const { stage } = ensureShell();
    stage.querySelectorAll('.skel-crossfade-out').forEach((el) => el.remove());

    const noMotion = reduceMotion();
    const currentLayer = stage.querySelector('.stage-layer');
    const shouldExit = !skipExit && !noMotion && Boolean(currentLayer);
    const exitMs = direction === 'fade' ? STAGE_FADE_EXIT_MS : STAGE_EXIT_MS;

    const readyPromise = (async () => {
      if (shouldExit) {
        currentLayer.classList.remove('enter-forward', 'enter-backward', 'enter-fade', 'data-crossfade-in');
        currentLayer.classList.add(`exit-${direction}`);
        await sleep(exitMs);
        if (token !== transitionToken) return;
      }

      const enterClass = noMotion ? '' : (skipExit ? 'enter-fade' : `enter-${direction}`);
      mountSkeletonLayer(mode, enterClass);

      if (!noMotion) {
        await sleep(MIN_SKEL_MS);
      }
    })();

    activeTransition = { token, readyPromise };
  }

  async function waitForTransitionReady(seq) {
    const t = activeTransition;
    if (t) {
      await t.readyPromise;
      if (seq !== refreshSeq || t.token !== transitionToken) return false;
      if (activeTransition === t) activeTransition = null;
    }
    return seq === refreshSeq;
  }

  function switchView(next) {
    if (!next || next === viewMode) return;
    const prev = viewMode;
    if (prev !== 'settings') previousViewMode = prev;
    const direction = next === 'settings'
      ? 'forward'
      : (prev === 'settings' ? 'backward' : (next === 'summary' ? 'forward' : 'backward'));
    viewMode = next;
    if (viewMode !== 'settings') saveUiState();
    lastFetchError = '';
    pricingStatusMsg = '';
    pricingStatusErr = false;
    if (viewMode === 'summary') {
      lastSummaryPayload = '';
    } else if (viewMode === 'session') {
      lastSessionPayload = '';
      lastAnimatedSessionId = '';
    }
    beginViewTransition({ mode: viewMode, direction });
    resetPollTimer();
    refresh(true);
  }

  function commitViewContent(innerHtml) {
    const { stage } = ensureShell();
    stage.querySelectorAll('.skel-crossfade-out').forEach((el) => el.remove());

    const prevRects = captureSegRects(stage);
    const skelLayer = stage.querySelector('.stage-layer.stage-skeleton');
    const contentLayer = document.createElement('div');
    contentLayer.className = 'stage-layer stage-content';
    contentLayer.innerHTML = innerHtml;

    stage.removeAttribute('aria-busy');
    stage.removeAttribute('aria-label');

    if (skelLayer && !reduceMotion()) {
      skelLayer.classList.remove('stage-skeleton', 'enter-forward', 'enter-backward', 'enter-fade');
      skelLayer.classList.add('skel-crossfade-out');
      skelLayer.setAttribute('aria-hidden', 'true');
      contentLayer.classList.add('data-crossfade-in');
      stage.appendChild(contentLayer);
      setTimeout(() => {
        if (skelLayer.isConnected) skelLayer.remove();
      }, CROSSFADE_OUT_MS + 40);
    } else {
      stage.replaceChildren(contentLayer);
    }

    syncSegThumbs(contentLayer, prevRects);
    bindStageActionEvents(contentLayer);
    return contentLayer;
  }

  function restoreTabFocus() {
    if (!pendingTabFocus) return;
    pendingTabFocus = false;
    const activeTab = appEl.querySelector('.seg-bar[role="tablist"] [role="tab"][aria-selected="true"]');
    activeTab?.focus();
  }

  function bindTopBarEvents(topBar) {
    const viewTabs = Array.from(topBar.querySelectorAll('.seg-btn[data-view][role="tab"]'));
    viewTabs.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        switchView(btn.getAttribute('data-view'));
      });
      btn.addEventListener('keydown', (e) => {
        let targetIdx = -1;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          targetIdx = (idx + 1) % viewTabs.length;
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          targetIdx = (idx - 1 + viewTabs.length) % viewTabs.length;
        } else if (e.key === 'Home') {
          targetIdx = 0;
        } else if (e.key === 'End') {
          targetIdx = viewTabs.length - 1;
        }
        if (targetIdx < 0) return;
        e.preventDefault();
        const target = viewTabs[targetIdx];
        pendingTabFocus = true;
        target.focus();
        switchView(target.getAttribute('data-view'));
      });

      btn.addEventListener('click', () => {

  function collectPricingDraftFromDom(root) {
    const rateInput = root.querySelector('#input-usd-cny');
    const rateVal = Number(rateInput?.value);
    const nextRate = Number.isFinite(rateVal) && rateVal > 0 ? rateVal : usdToCny;
    const ruleEls = Array.from(root.querySelectorAll('.price-rule[data-rule-idx]'));
    const rules = ruleEls.map((el, idx) => {
      const label = el.querySelector('[data-field="label"]')?.value?.trim() || '';
      const kwRaw = el.querySelector('[data-field="keywords"]')?.value || '';
      const keywords = kwRaw.split(/[,，]/).map((k) => k.trim().toLowerCase()).filter(Boolean);
      const numVal = (field) => {
        const v = Number(el.querySelector(`[data-field="${field}"]`)?.value);
        return Number.isFinite(v) && v >= 0 ? v : 0;
      };
      const id = el.getAttribute('data-rule-id') || `custom-${Date.now()}-${idx}`;
      return {
        id,
        label: label || keywords[0] || `自定义模型 ${idx + 1}`,
        keywords,
        input: numVal('input'),
        cacheRead: numVal('cacheRead'),
        cacheWrite: numVal('cacheWrite'),
        output: numVal('output'),
      };
    }).filter((r) => r.keywords.length > 0);
    return { usdToCny: nextRate, rules };
  }

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(next),

        const data = await res.json();
        if (!res.ok || data?.error) throw new Error(data?.message || `HTTP ${res.status}`);
        usdToCny = Number(data.config?.usdToCny) || next.usdToCny;

      <footer class="num">
        <span>时段: ${ranges.find((r) => r.id === summaryRange)?.label || summaryRange} · ${isCost ? '按公开 API 参考价估算 · ' : ''}每 60s 自动更新</span>
        <span>${esc(updatedTime)}</span>
      </footer>
    `);

    contentLayer.querySelector('#btn-toggle-top-convs')?.addEventListener('click', () => {
      topConvsExpanded = !topConvsExpanded;
      pendingExpandAnim = topConvsExpanded ? 'topConvs' : '';
      saveUiState();
      renderSummary(summary);
    });

    contentLayer.querySelectorAll('.sub-row[data-conv-id]').forEach((el) => {
      const openConv = () => {
        const cid = el.getAttribute('data-conv-id');
        if (!cid) return;
        selectedConversationId = cid === hostCid ? '' : cid;
        expandedTurns.clear();
        viewMode = 'session';
        saveUiState();
        currentPage = 1;
        lastSessionPayload = '';
        lastAnimatedSessionId = '';
        beginViewTransition({ mode: 'session', direction: 'backward' });
        resetPollTimer();
        refresh(true);
      };
      el.addEventListener('click', openConv);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openConv();
        }
      });
    });
    mountTimelineChart(summary.timeline);
    pendingChartAnim = false;
    pendingExpandAnim = '';
  }

  function render(data) {
    disposeCharts();
    const hostCid = activeSidecarConversation();
    if (!data || data.error === 'no-conversation') {
      lastData = null;
      commitViewContent('<p class="empty">暂无活跃会话，发送一条消息后将自动显示。</p>');
      return;
    }
    if (data.error) {
      commitViewContent(renderErrorCard('会话数据加载失败', data.message || data.error));
      return;
    }
    if (Number(data.cost?.usdToCny) > 0) {
      usdToCny = Number(data.cost.usdToCny);
    }
    lastData = data;

    const isRunning = String(data.status || '').includes('RUNNING');
    const statusLabel = isRunning ? '运行中' : (String(data.status || '').includes('IDLE') ? '待命' : '空闲');
    const ctx = data.context || {};
    const bd = data.breakdown || {};
    const totals = data.totals || {};
    const cache = data.cache || {};
    const speed = data.speed || {};
    const allTurns = Array.isArray(data.allTurns) ? data.allTurns : (Array.isArray(data.recentTurns) ? data.recentTurns : []);

    const ctxPct = Math.max(0, Math.min(100, Number(ctx.pct) || 0));
    const ctxToneClass = toneClass(ctxPct);

    // 100-dot grid (CSS variables only)
    const cats = Array.isArray(bd.categories) ? bd.categories : [];
    const colorToCatObj = new Map(cats.map((c) => [c.color, c]));
    const sessionAnimKey = `${data.cascadeId || 'mock'}:${mockMode ? mockScenario : 'live'}`;
    const shouldAnimateDots = lastAnimatedSessionId !== sessionAnimKey;
    lastAnimatedSessionId = sessionAnimKey;

    const dots = Array.isArray(bd.dots) ? bd.dots : new Array(100).fill(null);
    const dotsHtml = dots.map((c, idx) => {
      const catObj = c ? colorToCatObj.get(c) : null;
      const catAttr = catObj ? catObj.name : (c ? '__other__' : '__free__');
      const dotColor = catObj ? resolveCtxVar(catObj) : (c ? 'var(--ctx-other)' : '');
      const delay = (idx % 20) * 16 + Math.floor(idx / 20) * 32;
      const delayStyle = shouldAnimateDots ? `--dot-delay:${delay}ms;` : '';
      return c
        ? `<span class="ctx-dot" data-cat="${esc(catAttr)}" style="background:${dotColor};${delayStyle}"></span>`
        : `<span class="ctx-dot" data-cat="__free__" style="${delayStyle}"></span>`;
    }).join('');

    const visibleCats = catsExpanded ? cats : cats.slice(0, 4);
    const catsAnim = pendingExpandAnim === 'cats';
    const catsHtml = visibleCats.map((c, idx) => `
      <div class="cat-row${catsAnim && idx >= 4 ? ' anim-reveal' : ''}" data-cat="${esc(c.name)}">
        <span class="cat-mark" style="background:${resolveCtxVar(c)}"></span>
        <span>${esc(c.name)}</span>
        <span class="cat-tok num">${fmtTokHtml(c.tokens)}</span>
        <span class="cat-pct num">${fmtPct(c.pct)}</span>
      </div>
    `).join('');
    const catsMoreHtml = cats.length > 4 ? `
      <button id="btn-toggle-cats" class="cat-more-btn" type="button" aria-expanded="${catsExpanded}">
        <span>${catsExpanded ? '收起' : `展开其余 ${cats.length - 4} 项`}</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </button>
    ` : '';

    const freeHtml = ctx.max > 0 ? `
      <div class="cat-row" data-cat="__free__">
        <span class="cat-mark free"></span>
        <span class="dim">剩余可用</span>
        <span class="cat-tok num dim">${fmtTokHtml(bd.free?.tokens ?? ctx.free)}</span>
        <span class="cat-pct num">${fmtPct(bd.free?.pct ?? (100 - ctxPct))}</span>
      </div>
    ` : '';

    // Paginated turns
    const totalPages = Math.max(1, Math.ceil(allTurns.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageTurns = allTurns.slice(startIdx, startIdx + PAGE_SIZE);

    const turnsAnimClass = (pendingExpandAnim === 'turns' || pendingExpandAnim === 'page') ? ' anim-reveal' : '';
    const turnsBodyHtml = turnsExpanded ? `
      <div class="turn-list${turnsAnimClass}">
        ${pageTurns.length === 0
          ? '<p class="dim" style="font-size:11.5px;padding:12px;text-align:center;margin:0;">暂无模型调用记录</p>'
          : pageTurns.map((t) => {
              const turnKey = String(t.turnIndex);
              const isTurnOpen = expandedTurns.has(turnKey);
              const turnCostText = t.cost > 0 ? fmtCost(t.cost) : '';
              const tip = `输入 ${fmtTok(t.promptTotal)} (新 ${fmtTok(t.inputTokens)} / 缓存 ${fmtTok(t.cacheReadTokens)})\n输出 ${fmtTok(t.outputTokens)} (思考 ${fmtTok(t.thinkingOutputTokens)} / 正文 ${fmtTok(t.responseOutputTokens)})${turnCostText ? `\n估算费用 ${turnCostText}` : ''}\n首字 ${fmtSec(t.ttftSec)} · 流式 ${fmtSec(t.streamingSec)}`;
              const ariaLabel = `第 ${t.turnIndex} 轮，模型 ${t.modelName}，速度 ${fmtSpeed(t.tokensPerSec)}，首字 ${fmtSec(t.ttftSec)}，流式 ${fmtSec(t.streamingSec)}；输入 ${fmtTok(t.promptTotal)}（新 ${fmtTok(t.inputTokens)}，缓存 ${fmtTok(t.cacheReadTokens)}，命中 ${fmtPct(t.cacheHitRate)}）；输出 ${fmtTok(t.outputTokens)}（思考 ${fmtTok(t.thinkingOutputTokens)}，正文 ${fmtTok(t.responseOutputTokens)}）${turnCostText ? `；估算费用 ${turnCostText}` : ''}`;
              return `
                <div class="turn-item">
                  <div class="turn-row" role="button" tabindex="0" aria-expanded="${isTurnOpen}" data-turn-idx="${esc(turnKey)}" title="${esc(tip)}" aria-label="${esc(ariaLabel)}">
                    <div class="turn-left">
                      <div class="turn-title">
                        <span class="turn-num num">#${t.turnIndex}</span>
                        <span class="turn-model">${esc(t.modelName)}</span>
                      </div>
                      <div class="turn-sub num">
                        ↑${fmtTok(t.promptTotal)} (命中 ${fmtPct(t.cacheHitRate)}) · ↓${fmtTok(t.outputTokens)}${turnCostText ? ` · ${turnCostText}` : ''}
                      </div>
                    </div>
                    <div class="turn-right num">
                      <div class="turn-spd">${fmtSpeedHtml(t.tokensPerSec)}</div>
                      <div class="turn-dur">首字 ${fmtSec(t.ttftSec)}</div>
                    </div>
                  </div>
                  <div class="turn-detail num" ${isTurnOpen ? '' : 'hidden'}>
                    <span>新输入 ${fmtTok(t.inputTokens)} / 缓存 ${fmtTok(t.cacheReadTokens)}</span>
                    <span>思考 ${fmtTok(t.thinkingOutputTokens)} / 正文 ${fmtTok(t.responseOutputTokens)}</span>
                    <span>流式时长 ${fmtSec(t.streamingSec)}${turnCostText ? ` · 费用 ${turnCostText}` : ''}</span>
                  </div>
                </div>
              `;
            }).join('')}
      </div>
      ${allTurns.length > PAGE_SIZE ? `
        <div class="pager num">
          <span>第 ${currentPage} / ${totalPages} 页 · 共 ${allTurns.length} 轮</span>
          <div class="pager-btns">
            <button id="btn-prev" class="icon-btn" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>
            <button id="btn-next" class="icon-btn" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>
          </div>
        </div>
      ` : ''}
    ` : '';

    const allSubagents = Array.isArray(data.subagents) ? data.subagents : [];
    const swarmWorkers = allSubagents.filter((s) => s.isSwarm);
    const normalSubagents = allSubagents.filter((s) => !s.isSwarm);

    const swarmSubTotalTok = swarmWorkers.reduce((sum, s) => sum + (Number(s?.totals?.all) || 0), 0);
    const swarmSubTotalCost = swarmWorkers.reduce((sum, s) => sum + (s?.cost?.priced ? (Number(s.cost.total) || 0) : 0), 0);
    const swarmRunningCount = swarmWorkers.filter((s) => !s.killed && String(s.status || '').includes('RUNNING')).length;
    const swarmVars = ['var(--swarm-1)', 'var(--swarm-2)', 'var(--swarm-3)', 'var(--swarm-4)', 'var(--swarm-5)', 'var(--swarm-6)'];
    const teamTotalTok = (Number(totals.all) || 0) + swarmSubTotalTok;

    function renderAgentRows(list, useShortName) {
      return list.map((s) => {
        const sRunning = !s.killed && String(s.status || '').includes('RUNNING');
        const sDotClass = s.killed ? 'killed' : (sRunning ? 'running' : '');
        const stateText = s.killed ? '已终止' : (sRunning ? '运行中' : '待命');
        const stateClass = s.killed ? 'killed' : (sRunning ? 'running' : 'idle');
        const sCtx = s.context || {};
        const sPct = Math.max(0, Math.min(100, Number(sCtx.pct) || 0));
        const sTone = toneColor(sPct);
        const sToneCls = toneClass(sPct);
        const sSpeed = fmtSpeed(s.speed?.latestTokensPerSec);
        const sHit = s.cache?.overallHitRate != null ? `${s.cache.overallHitRate.toFixed(0)}%` : '-';
        const sCost = s.cost?.priced && s.cost.total > 0 ? ` · ${fmtCost(s.cost.total)}` : '';
        const displayName = (useShortName && s.scriptName) ? s.scriptName : s.role;
        return `
          <div class="sub-row" role="button" tabindex="0" data-sub-id="${esc(s.id)}" title="${esc(s.role)} · 点击查看详情">
            <div class="sub-left">
              <div class="sub-title">
                <span class="sub-dot ${sDotClass}"></span>
                <span class="sub-role">${esc(displayName)}</span>
                <span class="state-pill ${stateClass}">${stateText}</span>
              </div>
              <div class="sub-meta num">
                ${esc(s.modelName || '-')} · ${s.turnCount || 0} 轮 · ${sSpeed} · 命中 ${sHit} · ${fmtTok(s.totals?.all || 0)}${sCost}
              </div>
            </div>
            <div class="sub-right num">
              <div class="sub-ctx ${sToneCls}">${sCtx.max > 0 ? fmtPctHtml(sPct) : fmtTokHtml(sCtx.used || 0)}</div>
              <div class="sub-bar"><div style="width:${sPct.toFixed(1)}%;background:${sTone}"></div></div>
            </div>
            <svg class="row-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
          </div>
        `;
      }).join('');
    }

    const swarmDistHtml = (swarmWorkers.length > 0 && swarmExpanded && teamTotalTok > 0) ? (() => {
      const members = [
        { label: '主代理', tokens: Number(totals.all) || 0, color: 'var(--swarm-0)' },
        ...swarmWorkers.map((s, idx) => ({
          label: s.scriptName || s.role,
          tokens: Number(s?.totals?.all) || 0,
          color: swarmVars[idx % swarmVars.length],
        })),
      ].filter((m) => m.tokens > 0);
      return `
        <div class="swarm-dist">
          <div class="swarm-dist-head num">
            <span>全队 Token 分布</span>
            <span>主+从共 <b>${fmtTok(teamTotalTok)}</b></span>
          </div>
          <div class="swarm-stack">
            ${members.map((m) => {
              const w = (m.tokens / teamTotalTok) * 100;
              return `<div class="swarm-seg" style="width:${w.toFixed(2)}%;background:${m.color}" title="${esc(m.label)}: ${fmtTok(m.tokens)} (${w.toFixed(1)}%)"></div>`;
            }).join('')}
          </div>
          <div class="swarm-legend num">
            ${members.map((m) => `
              <span class="swarm-leg-item">
                <span class="swarm-leg-dot" style="background:${m.color}"></span>
                <span>${esc(m.label)} ${fmtTok(m.tokens)}</span>
              </span>
            `).join('')}
          </div>
        </div>
      `;
    })() : '';

    const swarmHtml = swarmWorkers.length > 0 ? `
      <div class="sub-card">
        <button id="btn-toggle-swarm" class="turns-toggle" type="button" aria-expanded="${swarmExpanded}">
          <span class="turns-toggle-left">
            <svg class="chevron ${swarmExpanded ? 'open' : ''}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 4l4 4-4 4"/>
            </svg>
            <span>Swarm 团队 (${swarmWorkers.length})</span>
            ${swarmRunningCount > 0 ? `<span class="state-pill running num">${swarmRunningCount} 运行中</span>` : ''}
          </span>
          <span class="dim num" style="font-weight:400;font-size:11px;">成员 ${fmtTok(swarmSubTotalTok)} tok${swarmSubTotalCost > 0 ? ` · ${fmtCost(swarmSubTotalCost)}` : ''}</span>
        </button>
        ${swarmDistHtml}
        ${swarmExpanded ? `<div class="sub-list${pendingExpandAnim === 'swarm' ? ' anim-reveal' : ''}">${renderAgentRows(swarmWorkers, true)}</div>` : ''}
      </div>
    ` : '';

    const normalSubTok = normalSubagents.reduce((sum, s) => sum + (Number(s?.totals?.all) || 0), 0);
    const normalSubCost = normalSubagents.reduce((sum, s) => sum + (s?.cost?.priced ? (Number(s.cost.total) || 0) : 0), 0);
    const normalRunningCount = normalSubagents.filter((s) => !s.killed && String(s.status || '').includes('RUNNING')).length;
    const subagentsHtml = normalSubagents.length > 0 ? `
      <div class="sub-card">
        <button id="btn-toggle-subagents" class="turns-toggle" type="button" aria-expanded="${subagentsExpanded}">
          <span class="turns-toggle-left">
            <svg class="chevron ${subagentsExpanded ? 'open' : ''}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 4l4 4-4 4"/>
            </svg>
            <span>子代理 (${normalSubagents.length})</span>
            ${normalRunningCount > 0 ? `<span class="state-pill running num">${normalRunningCount} 运行中</span>` : ''}
          </span>
          <span class="dim num" style="font-weight:400;font-size:11px;">合计 ${fmtTok(normalSubTok)} tok${normalSubCost > 0 ? ` · ${fmtCost(normalSubCost)}` : ''}</span>
        </button>
        ${subagentsExpanded ? `<div class="sub-list${pendingExpandAnim === 'subagents' ? ' anim-reveal' : ''}">${renderAgentRows(normalSubagents, false)}</div>` : ''}
      </div>
    ` : '';

    const backTarget = data.parentConversationId || data.rootConversationId || (selectedConversationId && hostCid && selectedConversationId !== hostCid ? hostCid : '');
    const showBackBar = Boolean(backTarget && backTarget !== data.cascadeId);
    const backBarHtml = showBackBar ? `
      <div class="back-bar">
        <span class="dim">${data.parentConversationId ? '当前正在查看子代理' : '当前正在查看其他会话'}</span>
        <button id="btn-back-parent" class="back-btn" data-target="${esc(backTarget)}">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg>
          <span>${data.parentConversationId ? '返回主代理' : '回到当前会话'}</span>
        </button>
      </div>
    ` : '';

    const updatedTime = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString('zh-CN', { hour12: false }) : '';
    const heroAlertHtml = ctxPct >= 90
      ? `<div class="hero-alert crit" role="alert"><span>上下文已达 ${ctxPct.toFixed(0)}%，建议立即压缩或开启新对话</span><button id="btn-copy-compact" class="hero-alert-btn" type="button">复制 /compact</button></div>`
      : (ctxPct >= 75
          ? `<div class="hero-alert warn" role="alert"><span>上下文已达 ${ctxPct.toFixed(0)}%，建议适时执行 /compact 压缩</span><button id="btn-copy-compact" class="hero-alert-btn" type="button">复制 /compact</button></div>`
          : '');
    const topTitle = data.title || (data.cascadeId ? `会话 ${data.cascadeId.slice(0, 8)}` : '');
    const sessionLabel = data.title
      ? `${esc(data.title)} · ${esc((data.cascadeId || '').slice(0, 8))}`
      : `会话 ${esc((data.cascadeId || '').slice(0, 8))}`;
    const catSummary = cats.map((c) => `${c.name} ${fmtTok(c.tokens)} (${fmtPct(c.pct)})`).join('，');
    const dotGridLabel = ctx.max > 0
      ? `上下文窗口占用 ${fmtPct(ctxPct)}，已用 ${fmtTok(ctx.used)} / ${fmtTok(ctx.max)} tokens${catSummary ? '；主要构成：' + catSummary : ''}`
      : `上下文窗口已用 ${fmtTok(ctx.used)} tokens${catSummary ? '；主要构成：' + catSummary : ''}`;

    const contentLayer = commitViewContent(`
      ${renderErrBanner()}

      <div class="session-head">
        <div class="model-badge" title="状态：${esc(statusLabel)}">
          <span class="dot ${isRunning ? 'running' : ''}"></span>
          <span class="model-name">${esc(data.modelName)}</span>
        </div>
        ${topTitle ? `<div class="session-title" title="${esc(topTitle)}">${esc(topTitle)}</div>` : ''}
      </div>

      ${backBarHtml}

      <div class="hero">
        <div class="hero-top">
          <span class="hero-label">上下文窗口分布（每点 = 1%）</span>
          <span class="pct-pill ${ctxToneClass} num">
            ${ctx.max > 0 ? fmtPctHtml(ctxPct) : '-'}
          </span>
        </div>
        <div class="hero-nums num">
          <span class="hero-used">${fmtTokHtml(ctx.used)}</span>
          <span class="hero-max">/ ${ctx.max > 0 ? fmtTok(ctx.max) : '未知上限'} tokens</span>
        </div>
        ${heroAlertHtml}
        <div class="dot-grid${shouldAnimateDots ? ' animate-in' : ''}" role="img" aria-label="${esc(dotGridLabel)}" title="每个圆点约代表上下文窗口的 1%">${dotsHtml}</div>
        <div class="cat-list">
          ${catsHtml}
          ${catsMoreHtml}
          ${freeHtml}
        </div>
      </div>

      <div class="bento">
        <div class="kpi">
          <div class="kpi-head"><span>生成速度</span><span class="kpi-tag">最新</span></div>
          <div class="kpi-val num" style="color:var(--ok-fg)">${fmtSpeedHtml(speed.latestTokensPerSec)}</div>
          <div class="kpi-sub num">
            均值 ${fmtSpeed(speed.avgTokensPerSec)} · 首字 ${fmtSec(speed.latestTtftSec)}
          </div>
        </div>

        <div class="kpi">
          <div class="kpi-head"><span>缓存命中率</span><span class="kpi-tag">累计</span></div>
          <div class="kpi-val num">${fmtPctHtml(cache.overallHitRate)}</div>
          <div class="kpi-sub num">
            本轮 ${fmtPct(cache.latestHitRate)} · 省 ${fmtTok(cache.savedInputTokens)}
          </div>
        </div>

        <div class="kpi">
          <div class="kpi-head"><span>累计输入</span><span class="kpi-tag num">${data.turnCount} 轮</span></div>
          <div class="kpi-val num">${fmtTokHtml(totals.inputAll)}</div>
          <div class="kpi-sub num">
            新 ${fmtTok(totals.uncachedInput)} · 缓存 ${fmtTok(totals.cacheRead)}
          </div>
        </div>

        <div class="kpi">
          <div class="kpi-head"><span>累计输出</span><span class="kpi-tag num">总 ${fmtTok(totals.all)}</span></div>
          <div class="kpi-val num">${fmtTokHtml(totals.output)}</div>
          <div class="kpi-sub num">
            思考 ${fmtTok(totals.thinking)} · 回复 ${fmtTok(totals.response)}
          </div>
        </div>

        <div class="kpi kpi-wide">
          ${data.cost?.priced
            ? `
              <div class="kpi-head"><span>估算费用</span><span class="kpi-tag num">${currency} · 参考单价</span></div>
              <div class="kpi-val num">${fmtCostHtml(data.cost.total)}</div>
              <div class="kpi-sub num">
                输入 ${fmtCost(data.cost.input)} · 缓存 ${fmtCost(data.cost.cacheRead)} · 输出 ${fmtCost(data.cost.output)}${data.cost.savedByCache > 0 ? ` · <span style="color:var(--ok-fg)">省 ${fmtCost(data.cost.savedByCache)}</span>` : ''}
              </div>
            `
            : `
              <div class="kpi-head"><span>估算费用</span><span class="kpi-tag">未匹配单价</span></div>
              <div class="kpi-val"><span class="dim" style="font-size:14px;font-weight:500;">未配置模型单价</span></div>
              <div class="kpi-sub">可在右上角「单价设置」中为 ${esc(data.modelName || '当前模型')} 添加单价规则</div>
            `}
        </div>
      </div>

      ${renderToolTreemap(data.toolTreemap)}
      ${swarmHtml}
      ${subagentsHtml}

      <div class="turns-card">
        <button id="btn-toggle-turns" class="turns-toggle" type="button" aria-expanded="${turnsExpanded}">
          <span class="turns-toggle-left">
            <svg class="chevron ${turnsExpanded ? 'open' : ''}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 4l4 4-4 4"/>
            </svg>
            <span>调用明细</span>
          </span>
          <span class="dim num" style="font-weight:400;font-size:11px;">${allTurns.length} 轮历史</span>
        </button>
        ${turnsBodyHtml}
      </div>

      <footer class="num">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${sessionLabel} · ${data.numTotalSteps || 0} 步 · 自动刷新 2.5s</span>
        <span style="flex:none;">${esc(updatedTime)}</span>
      </footer>
    `);

    mountToolTreemapChart(data.toolTreemap);
    pendingChartAnim = false;
    pendingExpandAnim = '';
    contentLayer.querySelector('#btn-toggle-cats')?.addEventListener('click', () => {
      catsExpanded = !catsExpanded;
      pendingExpandAnim = catsExpanded ? 'cats' : '';
      saveUiState();
      render(lastData);
    });
    const heroEl = contentLayer.querySelector('.hero');
    if (heroEl) {
      let activeHoverCat = '';
      const setHoverCat = (cat) => {
        if (cat === activeHoverCat) return;
        activeHoverCat = cat;
        heroEl.classList.toggle('has-hover', Boolean(cat));
        heroEl.querySelectorAll('[data-cat]').forEach((el) => {
          el.classList.toggle('is-match', Boolean(cat) && el.getAttribute('data-cat') === cat);
        });
      };
      heroEl.addEventListener('mouseover', (e) => {
        const target = e.target.closest('[data-cat]');
        setHoverCat(target ? (target.getAttribute('data-cat') || '') : '');
      });
      heroEl.addEventListener('mouseleave', () => setHoverCat(''));
    }
    contentLayer.querySelector('#btn-copy-compact')?.addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      let copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText('/compact');
          copied = true;
        } catch {}
      }
      if (!copied) {
        let ta = null;
        try {
          ta = document.createElement('textarea');
          ta.value = '/compact';
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          copied = Boolean(document.execCommand && document.execCommand('copy'));
        } catch {
          copied = false;
        } finally {
          if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
        }
      }
      const orig = btn.dataset.origLabel || btn.textContent;
      btn.dataset.origLabel = orig;
      btn.textContent = copied ? '已复制' : '复制失败，请手动输入 /compact';
      setTimeout(() => {
        if (btn.isConnected) btn.textContent = orig;
      }, copied ? 1400 : 2400);
    });
    contentLayer.querySelectorAll('.seg-btn[data-tool-view]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-tool-view');
        if (!next || next === toolViewMode) return;
        toolViewMode = next;
        pendingExpandAnim = 'tools';
        pendingChartAnim = true;
        saveUiState();
        render(lastData);
      });
    });
    contentLayer.querySelector('#btn-back-parent')?.addEventListener('click', (e) => {
      const target = e.currentTarget.getAttribute('data-target') || '';
      selectedConversationId = target === hostCid ? '' : target;
      expandedTurns.clear();
      currentPage = 1;
      lastSessionPayload = '';
      lastAnimatedSessionId = '';
      beginViewTransition({ mode: 'session', direction: 'backward' });
      refresh(true);
    });
    contentLayer.querySelector('#btn-toggle-swarm')?.addEventListener('click', () => {
      swarmExpanded = !swarmExpanded;
      pendingExpandAnim = swarmExpanded ? 'swarm' : '';
      saveUiState();
      render(lastData);
    });
    contentLayer.querySelector('#btn-toggle-subagents')?.addEventListener('click', () => {
      subagentsExpanded = !subagentsExpanded;
      pendingExpandAnim = subagentsExpanded ? 'subagents' : '';
      saveUiState();
      render(lastData);
    });
    contentLayer.querySelector('#btn-toggle-turns')?.addEventListener('click', () => {
      turnsExpanded = !turnsExpanded;
      pendingExpandAnim = turnsExpanded ? 'turns' : '';
      saveUiState();
      render(lastData);
    });
    contentLayer.querySelectorAll('.turn-row[data-turn-idx]').forEach((row) => {
      const toggleTurn = () => {
        const idx = row.getAttribute('data-turn-idx');
        if (!idx) return;
        const detail = row.nextElementSibling;
        const nextOpen = !expandedTurns.has(idx);
        if (nextOpen) expandedTurns.add(idx);
        else expandedTurns.delete(idx);
        row.setAttribute('aria-expanded', String(nextOpen));
        if (detail && detail.classList.contains('turn-detail')) {
          detail.hidden = !nextOpen;
        }
      };
      row.addEventListener('click', toggleTurn);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleTurn();
        }
      });
    });
    contentLayer.querySelector('#btn-prev')?.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 1;
        pendingExpandAnim = 'page';
        render(lastData);
      }
    });
    contentLayer.querySelector('#btn-next')?.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage += 1;
        pendingExpandAnim = 'page';
        render(lastData);
      }
    });
    contentLayer.querySelectorAll('.sub-row[data-sub-id]').forEach((el) => {
      const openSub = () => {
        const sid = el.getAttribute('data-sub-id');
        if (!sid) return;
        selectedConversationId = sid === hostCid ? '' : sid;
        expandedTurns.clear();
        currentPage = 1;
        lastSessionPayload = '';
        lastAnimatedSessionId = '';
        beginViewTransition({ mode: 'session', direction: 'forward' });
        refresh(true);
      };
      el.addEventListener('click', openSub);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openSub();
        }
      });
    });
  }

  function serializePayload(obj) {
    if (!obj || typeof obj !== 'object') return String(obj);
    const { updatedAt, ...rest } = obj;
    return JSON.stringify(rest);
  }

  function setRefreshBtnLoading(loading) {
    const btn = document.getElementById('btn-refresh');
    if (!btn) return;
    btn.classList.toggle('loading', loading);
    btn.disabled = loading;
  }

  function resetPollTimer() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    if (viewMode === 'settings') return;
    const intervalMs = viewMode === 'summary' ? SUMMARY_POLL_MS : SESSION_POLL_MS;
    pollTimer = setInterval(() => refresh(false), intervalMs);
  }

  async function refreshPricing(seq) {
    if (mockMode) {
      const cfg = pricingDraft || getMockPricingDefaults();
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'settings') return;
      usdToCny = Number(cfg.usdToCny) || 6.67;
      renderSettings(cfg);
      return;
    }
    try {
      const res = await doFetch('/api/pricing');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (seq !== refreshSeq || viewMode !== 'settings') return;
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'settings') return;
      if (data?.error) throw new Error(data.message || data.error);
      const cfg = data?.config || getMockPricingDefaults();
      if (Number(cfg.usdToCny) > 0) usdToCny = Number(cfg.usdToCny);
      renderSettings(cfg);
    } catch (err) {
      if (seq !== refreshSeq || viewMode !== 'settings') return;
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'settings') return;
      disposeCharts();
      commitViewContent(renderErrorCard('单价配置加载失败', err.message || '请求失败'));
    }
  }

  async function refreshSummary(force, seq) {
    if (mockMode) {
      const summary = getMockSummary();
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'summary') return;
      lastFetchError = '';
      lastSummaryFetchedAt = Date.now();
      const serialized = serializePayload(summary);
      if (force || serialized !== lastSummaryPayload) {
        lastSummaryPayload = serialized;
        renderSummary(summary);
      }
      return;
    }
    try {
      const res = await doFetch(`/api/summary?range=${encodeURIComponent(summaryRange)}&scope=${encodeURIComponent(summaryScope)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const summary = await res.json();
      if (seq !== refreshSeq || viewMode !== 'summary') return;
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'summary') return;
      lastFetchError = '';
      lastSummaryFetchedAt = Date.now();
      const serialized = serializePayload(summary);
      if (force || serialized !== lastSummaryPayload) {
        lastSummaryPayload = serialized;
        renderSummary(summary);
      }
    } catch (err) {
      if (seq !== refreshSeq || viewMode !== 'summary') return;
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'summary') return;
      lastFetchError = err.message || '请求失败';
      if (lastSummary && !lastSummary.error) {
        renderSummary(lastSummary);
        return;
      }
      disposeCharts();
      commitViewContent(renderErrorCard('全局统计请求出错', lastFetchError));
    }
  }

  async function refreshSession(force, seq) {
    const cid = selectedConversationId || activeSidecarConversation();
    if (mockMode) {
      const data = getMockMetrics(cid);
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'session') return;
      lastFetchError = '';
      const serialized = serializePayload(data);
      if (force || serialized !== lastSessionPayload) {
        lastSessionPayload = serialized;
        render(data);
      }
      return;
    }
    try {
      const qs = cid ? `?conversationId=${encodeURIComponent(cid)}` : '';
      const metricsRes = await doFetch(`/api/metrics${qs}`);
      if (!metricsRes.ok) throw new Error(`HTTP ${metricsRes.status}`);
      const data = await metricsRes.json();
      if (seq !== refreshSeq || viewMode !== 'session') return;
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'session') return;
      if (data && data.error && data.error !== 'no-conversation' && lastData && !lastData.error) {
        lastFetchError = data.message || data.error;
        render(lastData);
        return;
      }
      lastFetchError = '';
      const serialized = serializePayload(data);
      if (force || serialized !== lastSessionPayload) {
        lastSessionPayload = serialized;
        render(data);
      }
    } catch (err) {
      if (seq !== refreshSeq || viewMode !== 'session') return;
      if (!(await waitForTransitionReady(seq)) || viewMode !== 'session') return;
      lastFetchError = err.message || '请求失败';
      if (lastData && !lastData.error) {
        render(lastData);
        return;
      }
      disposeCharts();
      commitViewContent(renderErrorCard('会话监控请求出错', lastFetchError));
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'r' || e.key === 'R') {
      if (viewMode === 'settings') return;
      e.preventDefault();
      resetPollTimer();
      refresh(true);
    } else if (e.key === '1' && viewMode !== 'session') {
      switchView('session');
    } else if (e.key === '2' && viewMode !== 'summary') {
      switchView('summary');
    } else if (e.key === 'Escape') {
      if (viewMode === 'settings') {
        switchView(previousViewMode || 'summary');
      } else {
        document.getElementById('btn-back-parent')?.click();
      }
    }
  });

  async function refresh(force = false) {
    if (document.hidden && !force) return;
    const seq = ++refreshSeq;
    if (force) setRefreshBtnLoading(true);
    try {
      if (viewMode === 'settings') {
        await refreshPricing(seq);
      } else if (viewMode === 'summary') {
        await refreshSummary(force, seq);
      } else {
        await refreshSession(force, seq);
      }
    } finally {
      if (seq === refreshSeq) setRefreshBtnLoading(false);
    }
  }

  beginViewTransition({ mode: viewMode, direction: 'fade', skipExit: true });
  resetPollTimer();
  refresh(true);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || viewMode === 'settings') return;
    if (viewMode === 'summary') {
      if (Date.now() - lastSummaryFetchedAt >= SUMMARY_POLL_MS) {
        resetPollTimer();
        refresh(false);
      }
    } else {
      refresh(false);
    }
  });
})();
</script>
</body>
</html>
