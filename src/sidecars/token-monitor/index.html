<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context &amp; Token Monitor</title>
<script src="/preload.js"></script>
<script src="/echarts.min.js" onerror="var s=document.createElement('script');s.src='./vendor/echarts.min.js';document.head.appendChild(s);"></script>
<style>
  :root {
    --fg: var(--foreground, #1f2328);
    --dim: var(--muted-foreground, #656d76);
    --bg: var(--background, transparent);
    --line: var(--border, color-mix(in srgb, var(--fg) 10%, transparent));
    --surface: color-mix(in srgb, var(--fg) 3.5%, transparent);
    --surface-hover: color-mix(in srgb, var(--fg) 6.5%, transparent);
    --track: color-mix(in srgb, var(--fg) 10%, transparent);
    --empty-dot: color-mix(in srgb, var(--fg) 14%, transparent);
    --accent: #3b82f6;
    --ok: #10b981;
    --warn: #f59e0b;
    --warn-fg: #b45309;
    --danger: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: var(--foreground, #e6edf3);
      --dim: var(--muted-foreground, #8b949e);
      --warn-fg: #fbbf24;
    }
  }
  :root.light-surface { --warn-fg: #b45309; }
  :root.dark-surface { --warn-fg: #fbbf24; }
  * { box-sizing: border-box; }
  ::selection {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    color: var(--fg);
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sub-row:focus-visible,
  .turn-row:focus-visible {
    outline-offset: -2px;
  }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--bg);
    font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--fg) 16%, transparent);
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--fg) 28%, transparent); }

  main { padding: 12px 14px 20px; overflow-x: clip; }
  .num { font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }

  /* Segmented Control */
  .seg-bar {
    display: inline-flex;
    padding: 2px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    gap: 2px;
  }
  .seg-btn {
    border: none;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.14s ease;
  }
  .seg-btn:hover { color: var(--fg); }
  .seg-btn:active { transform: scale(0.97); }
  .seg-btn.active {
    background: var(--surface-hover);
    color: var(--fg);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .filter-bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 8px;
  }
  .seg-bar.seg-sm {
    border-radius: 7px;
  }
  .seg-bar.seg-sm .seg-btn {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 11px;
    border-bottom: 1px solid var(--line);
    font-size: 11.5px;
  }
  .model-row:last-child { border-bottom: none; }
  .model-bar-wrap { flex: 1; min-width: 0; }
  .model-bar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 17px; margin-bottom: 4px; }
  .model-bar-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .model-bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.55s cubic-bezier(0.25, 1, 0.5, 1); }
  .model-bar.cost-bar > div { background: var(--warn); }
  .model-bar-sub {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--dim);
  }
  .sub-ctx-sub { font-size: 10.5px; color: var(--dim); margin-top: 1px; }

  /* Charts */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 11px;
    margin-bottom: 10px;
  }
  .chart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 17px;
    margin-bottom: 8px;
  }
  .chart-title { font-size: 11.5px; font-weight: 600; color: var(--fg); }
  .chart-svg { width: 100%; display: block; overflow: visible; }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--dim);
  }
  .chart-leg-item { display: inline-flex; align-items: center; gap: 4px; }
  .chart-leg-dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  /* Tool Treemap */
  .tm-pill-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
  }
  .session-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 28px;
    margin-bottom: 10px;
  }
  .session-title {
    min-width: 0; flex: 1;
    font-size: 12px; font-weight: 600; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: right;
  }
  .model-badge {
    display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 58%; flex: 0 1 auto;
    padding: 4px 10px 4px 8px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.running { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .model-name {
    font-weight: 600; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 26px; padding: 0 9px; border-radius: 7px;
    font: inherit; font-size: 11.5px; color: var(--dim);
    background: var(--surface); border: 1px solid var(--line);
    cursor: pointer; transition: all 0.15s ease;
  }
  .icon-btn:hover:not(:disabled) { color: var(--fg); background: var(--surface-hover); border-color: color-mix(in srgb, var(--fg) 20%, transparent); }
  .icon-btn:active:not(:disabled),
  .back-btn:active,
  .hero-alert-btn:active { transform: scale(0.97); }
  .icon-btn:disabled { opacity: 0.4; cursor: default; }
  .icon-btn svg { width: 13px; height: 13px; }
  .icon-btn.active {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .icon-btn.primary {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .icon-btn.primary:hover:not(:disabled) {
    color: #fff;
    background: color-mix(in srgb, var(--accent) 88%, #000);
    border-color: var(--accent);
  }
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 11px;
    margin-bottom: 10px;
  }
  .settings-note {
    font-size: 11px;
    color: var(--dim);
    margin: 0 0 8px;
    line-height: 1.45;
  }
  .rate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .rate-input-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .field-input {
    width: 100%;
    height: 26px;
    padding: 0 7px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 11.5px;
  }
  .field-input:focus {
    outline: 1.5px solid var(--accent);
    border-color: var(--accent);
  }
  .price-rule-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .price-rule {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 9px;
    background: color-mix(in srgb, var(--fg) 1.5%, transparent);
  }
  .price-rule-head {
    display: grid;
    grid-template-columns: 1fr 1fr 24px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .price-rule-del {
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .price-rule-del:hover {
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
  }
  .price-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }
  .price-field label {
    display: block;
    font-size: 10px;
    color: var(--dim);
    margin-bottom: 2px;
  }
  .price-field .field-input {
    height: 24px;
    padding: 0 5px;
    font-size: 11px;
  }
  .settings-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .settings-status {
    font-size: 11px;
    color: var(--ok);
  }
  .settings-status.err {
    color: var(--danger);
  }
  .icon-btn.loading svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .back-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px; padding: 6px 10px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    font-size: 11.5px;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    background: var(--surface); color: var(--accent);
    font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .back-btn:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }

  /* Hero Context Card with 100-dot grid */
  .hero {
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--fg) 4%, transparent);
    border-radius: 12px;
    padding: 14px 14px 12px;
    margin-bottom: 12px;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 21px; }
  .hero-label { font-size: 11.5px; font-weight: 500; color: var(--dim); }
  .pct-pill {
    font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
    border: 1px solid transparent;
  }
  .hero-nums { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 11px; }
  .hero-used { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .hero-max { font-size: 12.5px; color: var(--dim); }

  .dot-grid {
    display: grid;
    grid-template-columns: repeat(20, minmax(0, 1fr));
    gap: 4px;
    max-width: 320px;
    margin-bottom: 12px;
  }
  .ctx-dot {
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--empty-dot);
    transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
  }
  .dot-grid.animate-in .ctx-dot {
    animation: dotIn 0.52s cubic-bezier(0.25, 1, 0.5, 1) both;
    animation-delay: var(--dot-delay, 0ms);
  }
  @keyframes dotIn {
    from { opacity: 0; transform: scale(0.45); }
    to { opacity: 1; transform: scale(1); }
  }
  .hero.has-hover .ctx-dot { opacity: 0.24; }
  .hero.has-hover .ctx-dot.is-match { opacity: 1; transform: scale(1.22); }

  .cat-list {
    border-top: 1px solid var(--line);
    padding-top: 7px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cat-row {
    display: grid;
    grid-template-columns: 10px 1fr auto 42px;
    align-items: center;
    gap: 7px;
    min-height: 23px;
    font-size: 11.5px;
    padding: 3px 5px;
    margin: 0 -5px;
    border-radius: 6px;
    cursor: default;
    transition: background-color 0.14s ease;
  }
  .cat-row.is-match { background: var(--surface-hover); }
  .cat-more-btn {
    align-self: flex-start;
    margin-top: 2px;
    padding: 2px 6px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.14s ease, background-color 0.14s ease;
  }
  .cat-more-btn:hover { color: var(--fg); background: var(--surface-hover); }
  .cat-mark { width: 7px; height: 7px; border-radius: 50%; justify-self: center; }
  .cat-mark.free { background: transparent; border: 1.5px solid var(--empty-dot); }
  .cat-tok { text-align: right; font-weight: 500; }
  .cat-pct { text-align: right; color: var(--dim); font-size: 11px; }

  .hero-alert {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 10px;
    padding: 7px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.4;
  }
  .hero-alert.warn {
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    color: var(--warn-fg);
  }
  .hero-alert.crit {
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 38%, transparent);
    color: var(--danger);
  }
  .hero-alert-btn {
    flex: none;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.14s ease;
  }
  .hero-alert-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }

  .err-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 32%, transparent);
    color: var(--danger);
    font-size: 11.5px;
  }
  .empty-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    color: var(--dim);
  }
  .empty-card-title { font-size: 12.5px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .empty-card-desc { font-size: 11.5px; margin-bottom: 12px; }
  .empty-card-actions { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .mock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    padding: 6px 9px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent);
    font-size: 11px;
  }
  .mock-tag { font-weight: 600; color: var(--accent); }

  /* Bento KPI Grid */
  .bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    transition: border-color 0.15s ease;
  }
  .kpi:hover { border-color: color-mix(in srgb, var(--fg) 18%, transparent); }
  .kpi-head { display: flex; align-items: center; justify-content: space-between; min-height: 16px; font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .kpi-tag {
    font-size: 10px; padding: 0 5px; border-radius: 4px;
    background: var(--track); color: var(--dim);
  }
  .kpi-val { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); min-height: 26px; }
  .kpi-sub { font-size: 11px; color: var(--dim); margin-top: 4px; line-height: 1.4; min-height: 15.5px; }
  .stage-skeleton .kpi-val,
  .stage-skeleton .kpi-sub,
  .skel-crossfade-out .kpi-val,
  .skel-crossfade-out .kpi-sub { display: flex; align-items: center; }

  /* Subagents Section */
  .sub-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .sub-list { border-top: 1px solid var(--line); }
  .sub-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 11px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  .sub-row:last-child { border-bottom: none; }
  .sub-row:hover { background: var(--surface-hover); }
  .sub-left { min-width: 0; flex: 1; }
  .sub-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .sub-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .sub-dot.running { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); animation: pulse 1.4s ease-in-out infinite; }
  .sub-dot.killed { background: var(--dim); }
  .sub-role { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-meta { font-size: 11px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-right { text-align: right; flex: none; min-width: 78px; }
  .sub-ctx { font-size: 11.5px; font-weight: 600; }
  .sub-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 4px; }
  .sub-bar > div { height: 100%; border-radius: 999px; transition: width 0.55s cubic-bezier(0.25, 1, 0.5, 1); }

  .swarm-dist {
    padding: 9px 11px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 1.5%, transparent);
  }
  .swarm-dist-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--dim); margin-bottom: 6px;
  }
  .swarm-stack {
    display: flex; height: 7px; border-radius: 999px; overflow: hidden; gap: 1.5px;
    background: var(--track); margin-bottom: 7px;
  }
  .swarm-seg { height: 100%; min-width: 3px; }
  .swarm-legend {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-size: 10.5px; color: var(--dim);
  }
  .swarm-leg-item { display: inline-flex; align-items: center; gap: 4px; }
  .swarm-leg-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .state-pill {
    font-size: 10px; font-weight: 500; padding: 0 5px; border-radius: 4px; flex: none;
  }
  .state-pill.running { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .state-pill.idle { color: var(--dim); background: var(--track); }
  .state-pill.killed { color: var(--dim); opacity: 0.7; background: var(--track); }

  /* Collapsible & Paginated Turns */
  .turns-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .turns-toggle,
  .card-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    padding: 9px 11px;
    border: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
  }
  .turns-toggle {
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  .turns-toggle:hover { background: var(--surface-hover); }
  .turns-toggle-left { display: inline-flex; align-items: center; gap: 6px; }
  .chevron { width: 13px; height: 13px; color: var(--dim); transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); }

  .stage-layer.enter-backward {
    animation: stageEnterLeft 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;

    to { opacity: 0; }
  }
  @keyframes stageEnterRight {
    from { opacity: 0; transform: translateX(14px); }
    to { opacity: 1; transform: translateX(0); }

  @keyframes stageEnterLeft {
    from { opacity: 0; transform: translateX(-14px); }

<script>
(() => {

      for (let i = 0; i < count && cursor < 100; i++, cursor++) {
        dots[cursor] = c.color;

  function getMockMetrics(cid) {

        status: 'CASCADE_RUN_STATUS_IDLE',
        modelName: 'Gemini 4 Hydrogen (Medium)',
        turnCount: 6,
        numTotalSteps: 18,
        updatedAt: Date.now(),
        context: { used: 80000, max, free: 120000, pct: 40.0 },
        breakdown: { dots: buildMockDots(cats, max), categories: cats, free: { tokens: 120000, pct: 60.0 } },
        speed: { latestTokensPerSec: 84, avgTokensPerSec: 76, latestTtftSec: 0.72 },
        cache: { overallHitRate: 74.2, latestHitRate: 81.5, savedInputTokens: 195000 },
        totals: { all: 286400, inputAll: 262000, uncachedInput: 67000, cacheRead: 195000, output: 24400, thinking: 14200, response: 10200 },
        allTurns: [
          { turnIndex: 6, modelName: 'Gemini 4 Hydrogen', promptTotal: 52000, inputTokens: 9600, cacheReadTokens: 42400, cacheHitRate: 81.5, outputTokens: 4200, thinkingOutputTokens: 2500, responseOutputTokens: 1700, tokensPerSec: 84, ttftSec: 0.72, streamingSec: 1.9 },

    const isHigh = mockScenario === 'high';

    const used = cats.reduce((s, c) => s + c.tokens, 0);
    const pct = (used / max) * 100;
    const turns = Array.from({ length: 14 }, (_, i) => {

    return {

      title: isHigh ? '长上下文架构重构排查' : (isSwarm ? 'Swarm 并行优化侧边栏' : '评价状态栏与侧边栏设计'),

      modelName: 'Gemini 4 Hydrogen (Medium)',

      context: { used, max, free: max - used, pct },
      breakdown: { dots: buildMockDots(cats, max), categories: cats, free: { tokens: max - used, pct: 100 - pct } },
      speed: { latestTokensPerSec: 78, avgTokensPerSec: 71, latestTtftSec: 0.82 },

  function getMockPricingDefaults() {

        { id: 'gpt-flagship', label: 'GPT-4o / GPT-5 / o3', keywords: ['gpt-4o', 'gpt-5', 'o3'], input: 2.5, cacheRead: 1.25, cacheWrite: 2.5, output: 10.0 },
      ],
    };
  }

  function fmtCost(usd, { compact = false } = {}) {
    const raw = Number(usd);
    if (!Number.isFinite(raw) || raw < 0) return '-';
    const sym = currency === 'CNY' ? '¥' : '$';
    const v = currency === 'CNY' ? raw * usdToCny : raw;
    if (v === 0) return `${sym}0`;
    if (v < 0.001) return `<${sym}0.001`;
    if (v < 0.01) return `${sym}${v.toFixed(4)}`;
    if (v < 1) return `${sym}${v.toFixed(3)}`;
    if (compact && v >= 1000) return `${sym}${(v / 1000).toFixed(2)}k`;
    return `${sym}${v.toFixed(2)}`;
  }

  function convertCost(usd) {
    const raw = Number(usd) || 0;
    return currency === 'CNY' ? raw * usdToCny : raw;
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function fmtTok(n) {
    const v = Number(n) || 0;
    if (v >= 1e6) return `${(v / 1e6).toFixed(v % 1e6 === 0 ? 0 : 2)}M`;
    if (v >= 1e3) return `${(v / 1e3).toFixed(1)}k`;
    return String(Math.round(v));
  }

  function fmtPct(v) {
    if (v == null || !Number.isFinite(v)) return '-';
    return `${v.toFixed(1)}%`;
  }

  function fmtSpeed(v) {
    if (v == null || !Number.isFinite(v)) return '-';
    return `${v.toFixed(0)} tok/s`;
  }

  function fmtSec(v) {
    if (v == null || !Number.isFinite(v)) return '-';
    return v >= 10 ? `${v.toFixed(1)}s` : `${v.toFixed(2)}s`;
  }

  function activeSidecarConversation() {
    return (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
  }

  function toneColor(pct) {
    if (pct >= 90) return 'var(--danger)';
    if (pct >= 75) return 'var(--warn)';
    return 'var(--accent)';
  }

  const chartInstances = [];

  function disposeCharts() {
    while (chartInstances.length > 0) {
      try { chartInstances.pop().dispose(); } catch {}
    }
  }

  function isDarkSurface() {
    let dark = null;
    const els = [document.body, document.documentElement];
    for (const el of els) {
      if (!el) continue;
      const bg = getComputedStyle(el).backgroundColor || '';
      const m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      if (m) {
        const alpha = m[4] === undefined ? 1 : Number(m[4]);
        if (alpha > 0.1) {
          const lum = (0.299 * Number(m[1]) + 0.587 * Number(m[2]) + 0.114 * Number(m[3])) / 255;
          dark = lum <= 0.5;
          break;
        }
      }
    }
    if (dark === null) {
      dark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark-surface', dark);
    document.documentElement.classList.toggle('light-surface', !dark);
    return dark;
  }

  function getThemeColors() {
    const cs = getComputedStyle(document.documentElement);
    const isDark = isDarkSurface();
    const fg = cs.getPropertyValue('--fg').trim() || (isDark ? '#e6edf3' : '#1f2328');
    const dim = cs.getPropertyValue('--dim').trim() || (isDark ? '#8b949e' : '#656d76');
    const line = cs.getPropertyValue('--line').trim() || (isDark ? 'rgba(255,255,255,0.12)' : 'rgba(128,128,128,0.16)');
    const bg = cs.getPropertyValue('--bg').trim() || (isDark ? '#18181b' : '#ffffff');
    return {
      isDark,
      fg,
      dim,
      line,
      bg,
      tooltipBg: isDark ? 'rgba(24, 24, 27, 0.94)' : 'rgba(255, 255, 255, 0.96)',
      tooltipBorder: isDark ? 'rgba(255, 255, 255, 0.14)' : 'rgba(15, 23, 42, 0.1)',
    };
  }

  function reduceMotion() {
    return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function initEChart(domId, option) {
    if (typeof window.echarts === 'undefined') return null;
    const el = document.getElementById(domId);
    if (!el) return null;
    const chart = window.echarts.init(el, null, { renderer: 'svg' });
    chart.setOption({
      animation: !reduceMotion() && pendingChartAnim,
      animationDuration: 650,
      animationEasing: 'cubicOut',
      ...option,
    });
    chartInstances.push(chart);
    return chart;
  }

  window.addEventListener('resize', () => {
    for (const c of chartInstances) {
      try { c.resize(); } catch {}
    }
  });

  function renderToolTreemap(toolTreemap) {
    const groups = Array.isArray(toolTreemap?.groups) ? toolTreemap.groups : [];
    const total = Number(toolTreemap?.totalTokens) || 0;
    if (groups.length === 0 || total <= 0) return '';

    let bodyHtml = '';
    const toolBodyAnim = pendingExpandAnim === 'tools' ? ' anim-reveal' : '';
    if (toolViewMode === 'list') {
      bodyHtml = `
        <div class="sub-list${toolBodyAnim}" style="border:1px solid var(--line);border-radius:8px;overflow:hidden;">
          ${groups.map((g) => `
            <div class="model-row">
              <div class="model-bar-wrap">
                <div class="model-bar-top">
                  <span class="model-bar-name"><span class="tm-pill-dot" style="display:inline-block;margin-right:5px;background:${esc(g.color)}"></span>${esc(g.name)}</span>
                  <span class="num">${fmtTok(g.tokens)} <span class="dim">(${g.pct.toFixed(1)}% · ${g.count}次)</span></span>
                </div>
                <div class="model-bar"><div style="width:${Math.min(100, g.pct).toFixed(1)}%;background:${esc(g.color)}"></div></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    } else {
      bodyHtml = `<div id="chart-tool-treemap" class="${toolBodyAnim.trim()}" style="width:100%;height:184px;"></div>`;
    }

    return `
      <div class="chart-card">
        <div class="chart-head">
          <span class="chart-title">工具调用 Token 构成</span>
          <div style="display:inline-flex;align-items:center;gap:6px;">
            <span class="dim num" style="font-size:10.5px;">${fmtTok(total)}</span>
            <div class="seg-bar seg-sm" role="group" aria-label="工具构成视图">
              <button type="button" class="seg-btn ${toolViewMode === 'treemap' ? 'active' : ''}" data-tool-view="treemap" aria-pressed="${toolViewMode === 'treemap'}">矩形分布</button>
              <button type="button" class="seg-btn ${toolViewMode === 'list' ? 'active' : ''}" data-tool-view="list" aria-pressed="${toolViewMode === 'list'}">归类占比</button>
            </div>
          </div>
        </div>
        ${bodyHtml}
      </div>
    `;
  }

  function mountToolTreemapChart(toolTreemap) {
    if (toolViewMode !== 'treemap') return;
    const groups = Array.isArray(toolTreemap?.groups) ? toolTreemap.groups : [];
    const total = Number(toolTreemap?.totalTokens) || 0;
    if (groups.length === 0 || total <= 0) return;
    const theme = getThemeColors();

    const treeData = groups.map((g) => ({
      name: g.name,

      pct: g.pct,
      count: g.count,
      itemStyle: { color: g.color, borderColor: 'transparent', gapWidth: 2 },
      children: (g.items || []).map((it) => ({
        name: it.name,

        pct: it.pct,

        itemStyle: { color: g.color },

    initEChart('chart-tool-treemap', {
      tooltip: {
        confine: true,
        backgroundColor: theme.tooltipBg,
        borderColor: theme.tooltipBorder,
        borderWidth: 1,
        textStyle: { color: theme.fg, fontSize: 11 },
        formatter: (info) => {
          const d = info.data || {};
          const pctStr = Number.isFinite(d.pct) ? `${d.pct.toFixed(1)}%` : '';
          const title = d.groupName ? `${esc(d.groupName)} · ${esc(d.name)}` : esc(d.name);
          return `<div style="font-weight:600;margin-bottom:2px;">${title}</div>`
            + `<div>Tokens: <b>${fmtTok(d.value)}</b> (${pctStr})</div>`

        top: 2,
        bottom: 2,
        roam: false,
        nodeClick: false,
        breadcrumb: { show: false },
        itemStyle: {
          borderRadius: 5,
          borderColor: theme.bg === 'transparent' ? 'rgba(128,128,128,0.2)' : theme.bg,
          borderWidth: 1.5,
          gapWidth: 2,
        },
        upperLabel: {
          show: true,
          height: 18,
          color: '#111827',
          fontSize: 10,
          fontWeight: 600,
          formatter: (p) => `${p.name} ${Number(p.data?.pct || 0).toFixed(0)}%`,
        },
        label: {
          show: true,
          color: '#111827',
          fontSize: 10.5,
          fontWeight: 600,
          formatter: (p) => `${p.name}\n${fmtTok(p.value)}`,
        },
        levels: [
          {
            itemStyle: { borderWidth: 0, gapWidth: 3 },
            upperLabel: { show: false },
          },
          {
            itemStyle: { borderRadius: 6, gapWidth: 2, borderWidth: 1.5 },
            upperLabel: { show: true },
          },
        ],
        data: treeData,
      }],
    });
  }

  function renderTimelineBarChart(timeline) {
    if (!Array.isArray(timeline) || timeline.length === 0) return '';
    const isCost = summaryMetric === 'cost';
    const peakLabel = isCost
      ? `峰值 ${fmtCost(Math.max(0, ...timeline.map((b) => Number(b.cost) || 0)))}`
      : `峰值 ${fmtTok(Math.max(1, ...timeline.map((b) => b.total || 0)))}`;
    return `
      <div class="chart-card">

        </div>
        <div id="chart-timeline" style="width:100%;height:152px;"></div>

  function mountTimelineChart(timeline) {
    if (!Array.isArray(timeline) || timeline.length === 0) return;
    const theme = getThemeColors();
    const labels = timeline.map((b) => b.label);
    const isCost = summaryMetric === 'cost';
    const sym = currency === 'CNY' ? '¥' : '$';
    const fmtAxisCost = (v) => {
      if (v === 0) return `${sym}0`;
      if (v < 0.1) return `${sym}${v.toFixed(2)}`;
      if (v < 10) return `${sym}${v.toFixed(1)}`;
      return `${sym}${Math.round(v)}`;
    };

    initEChart('chart-timeline', {
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        confine: true,
        backgroundColor: theme.tooltipBg,
        borderColor: theme.tooltipBorder,
        borderWidth: 1,
        textStyle: { color: theme.fg, fontSize: 11 },
        formatter: (params) => {
          const idx = params?.[0]?.dataIndex ?? 0;
          const b = timeline[idx];
          if (!b) return '';
          if (isCost) {
            return `<div style="font-weight:600;margin-bottom:3px;">${esc(b.label)} · ${b.turns} 轮</div>`
              + `<div>估算费用: <b>${fmtCost(b.cost)}</b> <span style="opacity:0.75;">(${fmtTok(b.total)})</span></div>`
              + `<div><span style="color:#60a5fa">●</span> 缓存读取: ${fmtCost(b.cacheReadCost)}</div>`
              + `<div><span style="color:#3b82f6">●</span> 新输入: ${fmtCost(b.inputCost)}</div>`
              + `<div><span style="color:#f59e0b">●</span> 输出: ${fmtCost(b.outputCost)}</div>`;
          }
          return `<div style="font-weight:600;margin-bottom:3px;">${esc(b.label)} · ${b.turns} 轮</div>`
            + `<div>总计: <b>${fmtTok(b.total)}</b>${b.cost > 0 ? ` <span style="opacity:0.75;">(≈ ${fmtCost(b.cost)})</span>` : ''}</div>`
            + `<div><span style="color:#60a5fa">●</span> 缓存读取: ${fmtTok(b.cacheRead)}</div>`
            + `<div><span style="color:#3b82f6">●</span> 新输入: ${fmtTok(b.uncachedInput)}</div>`
            + `<div><span style="color:#f59e0b">●</span> 输出: ${fmtTok(b.output)}</div>`;
        },
      },
      legend: {
        bottom: 0,
        left: 0,
        itemWidth: 8,
        itemHeight: 8,
        icon: 'circle',
        textStyle: { color: theme.dim, fontSize: 10.5 },
        data: ['缓存读取', '新输入', '输出'],
      },
      grid: { top: 10, right: 8, bottom: 42, left: isCost ? 46 : 42 },
      xAxis: {
        type: 'category',
        data: labels,
        axisLine: { lineStyle: { color: theme.line } },
        axisTick: { show: false },
        axisLabel: { color: theme.dim, fontSize: 10, hideOverlap: true },
      },
      yAxis: {
        type: 'value',
        splitNumber: 3,
        axisLabel: {
          color: theme.dim,
          fontSize: 10,
          formatter: (v) => (isCost ? fmtAxisCost(v) : fmtTok(v)),
        },
        splitLine: { lineStyle: { color: theme.line, type: 'dashed' } },
      },
      series: [
        {
          name: '缓存读取',
          type: 'bar',
          stack: 'tok',
          barMaxWidth: 22,
          itemStyle: { color: '#60a5fa' },
          data: timeline.map((b) => (isCost ? convertCost(b.cacheReadCost) : (b.cacheRead || 0))),
        },
        {
          name: '新输入',
          type: 'bar',
          stack: 'tok',
          barMaxWidth: 22,
          itemStyle: { color: '#3b82f6' },
          data: timeline.map((b) => (isCost ? convertCost(b.inputCost) : (b.uncachedInput || 0))),
        },
        {
          name: '输出',
          type: 'bar',
          stack: 'tok',
          barMaxWidth: 22,
          itemStyle: { color: '#f59e0b', borderRadius: [3, 3, 0, 0] },
          data: timeline.map((b) => (isCost ? convertCost(b.outputCost) : (b.output || 0))),
        },
      ],
    });
  }

  const STAGE_EXIT_MS = 150;
  const STAGE_FADE_EXIT_MS = 120;
  const MIN_SKEL_MS = 360;
  const CROSSFADE_OUT_MS = 220;

  let transitionToken = 0;
  let activeTransition = null;
  let pendingTabFocus = false;

  function sleep(ms) {
    return ms > 0 ? new Promise((r) => setTimeout(r, ms)) : Promise.resolve();
  }

  function ensureShell() {
    let topBar = document.getElementById('top-bar');
    let stage = document.getElementById('view-stage');
    if (!topBar || !stage) {
      appEl.innerHTML = '<div id="top-bar"></div><div id="view-stage" class="view-stage"></div>';
      topBar = document.getElementById('top-bar');
      stage = document.getElementById('view-stage');
    }
    return { topBar, stage };
  }

  function syncTopBar() {
    const { topBar } = ensureShell();
    topBar.innerHTML = renderTopBar();
    bindTopBarEvents(topBar);
    restoreTabFocus();
  }

  function mountSkeletonLayer(mode, enterClass) {
    const { stage } = ensureShell();
    stage.setAttribute('aria-busy', 'true');
    stage.setAttribute('aria-label', mode === 'summary' ? '正在加载全局统计' : '正在加载会话数据');

    const layer = document.createElement('div');
    layer.className = `stage-layer stage-skeleton${enterClass ? ' ' + enterClass : ''}`;
    layer.innerHTML = renderSkeletonInnerHtml(mode);
    stage.replaceChildren(layer);
    if (mode === 'summary') {
      bindSummaryFilters(layer);
    }
  }

  function beginViewTransition({ mode = viewMode, direction = 'forward', skipExit = false } = {}) {
    disposeCharts();
    syncTopBar();
    setRefreshBtnLoading(true);
    pendingChartAnim = true;

    const token = ++transitionToken;
    const { stage } = ensureShell();
    stage.querySelectorAll('.skel-crossfade-out').forEach((el) => el.remove());

    const noMotion = reduceMotion();
    const currentLayer = stage.querySelector('.stage-layer');
    const shouldExit = !skipExit && !noMotion && Boolean(currentLayer);
    const exitMs = direction === 'fade' ? STAGE_FADE_EXIT_MS : STAGE_EXIT_MS;

    const readyPromise = (async () => {
      if (shouldExit) {
        currentLayer.classList.remove('enter-forward', 'enter-backward', 'enter-fade', 'data-crossfade-in');
        currentLayer.classList.add(`exit-${direction}`);
        await sleep(exitMs);
        if (token !== transitionToken) return;
      }

      const enterClass = noMotion ? '' : (skipExit ? 'enter-fade' : `enter-${direction}`);
      mountSkeletonLayer(mode, enterClass);

      if (!noMotion) {
        await sleep(MIN_SKEL_MS);
      }
    })();

    activeTransition = { token, readyPromise };
  }

  async function waitForTransitionReady(seq) {
    const t = activeTransition;
    if (t) {
      await t.readyPromise;
      if (seq !== refreshSeq || t.token !== transitionToken) return false;
      if (activeTransition === t) activeTransition = null;
    }
    return seq === refreshSeq;
  }

  function switchView(next) {
    if (!next || next === viewMode) return;
    const prev = viewMode;
    if (prev !== 'settings') previousViewMode = prev;
    const direction = next === 'settings'
      ? 'forward'
      : (prev === 'settings' ? 'backward' : (next === 'summary' ? 'forward' : 'backward'));
    viewMode = next;
    if (viewMode !== 'settings') saveUiState();
    lastFetchError = '';
    pricingStatusMsg = '';
    pricingStatusErr = false;
    if (viewMode === 'summary') {
      lastSummaryPayload = '';
    } else if (viewMode === 'session') {
      lastSessionPayload = '';
      lastAnimatedSessionId = '';
    }
    beginViewTransition({ mode: viewMode, direction });
    resetPollTimer();
    refresh(true);
  }

  function commitViewContent(innerHtml) {
    const { stage } = ensureShell();
    stage.querySelectorAll('.skel-crossfade-out').forEach((el) => el.remove());

    const skelLayer = stage.querySelector('.stage-layer.stage-skeleton');
    const contentLayer = document.createElement('div');
    contentLayer.className = 'stage-layer stage-content';
    contentLayer.innerHTML = innerHtml;

    stage.removeAttribute('aria-busy');
    stage.removeAttribute('aria-label');

    if (skelLayer && !reduceMotion()) {
      skelLayer.classList.remove('stage-skeleton', 'enter-forward', 'enter-backward', 'enter-fade');
      skelLayer.classList.add('skel-crossfade-out');
      skelLayer.setAttribute('aria-hidden', 'true');
      contentLayer.classList.add('data-crossfade-in');
      stage.appendChild(contentLayer);
      setTimeout(() => {
        if (skelLayer.isConnected) skelLayer.remove();
      }, CROSSFADE_OUT_MS + 40);
    } else {
      stage.replaceChildren(contentLayer);
    }

    bindStageActionEvents(contentLayer);
    return contentLayer;
  }

  function restoreTabFocus() {
    if (!pendingTabFocus) return;
    pendingTabFocus = false;
    const activeTab = appEl.querySelector('.seg-bar[role="tablist"] [role="tab"][aria-selected="true"]');
    activeTab?.focus();
  }

  function bindTopBarEvents(topBar) {
    const viewTabs = Array.from(topBar.querySelectorAll('.seg-btn[data-view][role="tab"]'));
    viewTabs.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        switchView(btn.getAttribute('data-view'));
      });
      btn.addEventListener('keydown', (e) => {
        let targetIdx = -1;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          targetIdx = (idx + 1) % viewTabs.length;
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          targetIdx = (idx - 1 + viewTabs.length) % viewTabs.length;
        } else if (e.key === 'Home') {
          targetIdx = 0;
        } else if (e.key === 'End') {
          targetIdx = viewTabs.length - 1;
        }
        if (targetIdx < 0) return;
        e.preventDefault();
        const target = viewTabs[targetIdx];
        pendingTabFocus = true;
        target.focus();
        switchView(target.getAttribute('data-view'));
      });
    });
    topBar.querySelectorAll('.seg-btn[data-mock-scenario]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-mock-scenario');
        if (!next) return;
        mockScenario = next;
        selectedConversationId = '';
        expandedTurns.clear();
        pendingChartAnim = true;
        currentPage = 1;
        lastData = null;
        lastSummary = null;
        lastFetchError = '';
        lastSessionPayload = '';
        lastSummaryPayload = '';
        lastAnimatedSessionId = '';
        beginViewTransition({ mode: viewMode, direction: 'fade' });
        refresh(true);
      });
    });
    topBar.querySelector('#btn-pricing-settings')?.addEventListener('click', () => {
      if (viewMode === 'settings') {
        switchView(previousViewMode || 'summary');
      } else {
        switchView('settings');
      }
    });
    topBar.querySelector('#btn-refresh')?.addEventListener('click', () => {
      resetPollTimer();
      refresh(true);
    });
  }

  function bindStageActionEvents(root) {
    root.querySelector('#btn-retry')?.addEventListener('click', () => {
      resetPollTimer();
      refresh(true);
    });
    root.querySelector('#btn-retry-inline')?.addEventListener('click', () => {
      resetPollTimer();
      refresh(true);
    });
    root.querySelector('#btn-enable-mock')?.addEventListener('click', () => {
      mockMode = true;
      mockScenario = 'normal';
      lastFetchError = '';
      lastSessionPayload = '';
      lastSummaryPayload = '';
      lastAnimatedSessionId = '';
      beginViewTransition({ mode: viewMode, direction: 'fade' });
      refresh(true);
    });
  }

  function collectPricingDraftFromDom(root) {
    const rateInput = root.querySelector('#input-usd-cny');
    const rateVal = Number(rateInput?.value);
    const nextRate = Number.isFinite(rateVal) && rateVal > 0 ? rateVal : usdToCny;
    const ruleEls = Array.from(root.querySelectorAll('.price-rule[data-rule-idx]'));
    const rules = ruleEls.map((el, idx) => {
      const label = el.querySelector('[data-field="label"]')?.value?.trim() || '';
      const kwRaw = el.querySelector('[data-field="keywords"]')?.value || '';
      const keywords = kwRaw.split(/[,，]/).map((k) => k.trim().toLowerCase()).filter(Boolean);
      const numVal = (field) => {
        const v = Number(el.querySelector(`[data-field="${field}"]`)?.value);
        return Number.isFinite(v) && v >= 0 ? v : 0;
      };
      const id = el.getAttribute('data-rule-id') || `custom-${Date.now()}-${idx}`;
      return {
        id,
        label: label || keywords[0] || `自定义模型 ${idx + 1}`,
        keywords,
        input: numVal('input'),
        cacheRead: numVal('cacheRead'),
        cacheWrite: numVal('cacheWrite'),
        output: numVal('output'),
      };
    }).filter((r) => r.keywords.length > 0);
    return { usdToCny: nextRate, rules };
  }

  function renderSettings(config) {
    disposeCharts();
    pricingDraft = {
      usdToCny: Number(config?.usdToCny) > 0 ? Number(config.usdToCny) : usdToCny,
      rules: Array.isArray(config?.rules)
        ? config.rules.map((r) => ({ ...r, keywords: Array.isArray(r.keywords) ? [...r.keywords] : [] }))
        : getMockPricingDefaults().rules,
    };

    const contentLayer = commitViewContent(`
      <div class="back-bar">

        <p class="settings-note">按从上到下顺序匹配模型名关键词（多个关键词用英文逗号分隔）。自定义规则会自动置顶，可覆盖下方默认档位。</p>
        <div class="price-rule-list">
          ${pricingDraft.rules.map((r, idx) => `
            <div class="price-rule" data-rule-idx="${idx}" data-rule-id="${esc(r.id || '')}">
              <div class="price-rule-head">
                <input class="field-input" data-field="label" type="text" placeholder="显示名称" value="${esc(r.label)}" aria-label="模型显示名称">

                <div class="price-field">
                  <label>缓存读</label>
                  <input class="field-input num" data-field="cacheRead" type="number" step="0.005" min="0" value="${esc(r.cacheRead)}">
                </div>

                  <label>缓存写</label>

                </div>
                <div class="price-field">

            </div>
          `).join('')}
        </div>

        <div class="settings-actions">
          <div style="display:flex;gap:6px;">
            <button id="btn-save-pricing" class="icon-btn primary" type="button">保存配置</button>
            <button id="btn-reset-pricing" class="icon-btn" type="button">恢复默认</button>
